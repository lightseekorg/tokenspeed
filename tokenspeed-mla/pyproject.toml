[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenspeed-mla"
version = "0.2.22"
description = "Speed-of-light TokenSpeed MLA kernels."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "apache-tvm-ffi>=0.1.11,<0.2",
    "nvidia-cutlass-dsl>=4.8.0",
    "tokenspeed-triton>=3.9.10.post20261008",
    "torch",
]

[project.urls]
Homepage = "https://github.com/lightseekorg/tokenspeed"
Repository = "https://github.com/lightseekorg/tokenspeed"

[tool.setuptools]
license-files = ["LICENSE", "THIRDPARTYNOTICES"]

[tool.setuptools.packages.find]
where = ["python"]
