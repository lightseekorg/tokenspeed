name: Kimi Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: kimi-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Kimi PR Review
    if: >-
      github.repository == 'lightseekorg/tokenspeed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Kimi Code CLI
        run: npm install --global @moonshot-ai/kimi-code@2.1.1

      - name: Prepare review
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/kimi-code-review.py prepare

      - name: Run read-only review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-home
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/kimi-code-review.py review

      - name: Publish review
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/kimi-code-review.py publish
