name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scheduler_cpp: ${{ steps.scheduler_cpp_changes.outputs.changed }}
      pre_commit_skip: ${{ steps.scheduler_cpp_changes.outputs.pre_commit_skip }}
    steps:
      - uses: actions/checkout@v2

      - name: Detect scheduler C++ changes
        id: scheduler_cpp_changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/tokenspeed-lint-changed-files.txt"
          scheduler_cpp_files='^tokenspeed-scheduler/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
          scheduler_cpp_config='^(tokenspeed-scheduler/(\.clang-format|(.*/)?CMakeLists\.txt|.*\.cmake)|\.github/workflows/lint\.yml)$'

          list_changed_files() {
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" &&
                git diff --name-only --no-renames "$PUSH_BEFORE" "$GITHUB_SHA"
            else
              gh api \
                "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate \
                -q '.[] | .filename, (.previous_filename // empty)'
            fi
          }

          if ! list_changed_files > "$changed_files" || [[ ! -s "$changed_files" ]]; then
            echo "::warning::Unable to classify changed files; running scheduler C++ lint"
            changed=true
          elif grep -Eq \
            -e "$scheduler_cpp_files" \
            -e "$scheduler_cpp_config" \
            "$changed_files"; then
            changed=true
          else
            changed=false
          fi

          # CI validates merged code; branch protection is a local commit guard.
          if [[ "$changed" == "true" ]]; then
            pre_commit_skip=no-commit-to-branch
          else
            pre_commit_skip=no-commit-to-branch,clang-format
          fi
          {
            echo "changed=$changed"
            echo "pre_commit_skip=$pre_commit_skip"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pre-commit hook
        run: |
          python -m pip install pre-commit ruff
          pre-commit install

      # Hook environments and black's per-file cache; main refreshes them for PRs.
      - name: Restore pre-commit cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/black
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.run_id }}
          restore-keys: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}-

      - name: Linting
        env:
          SKIP: ${{ needs.changes.outputs.pre_commit_skip }}
        run: pre-commit run --all-files

      - name: Save pre-commit cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/black
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.run_id }}

      - name: Lint runtime Python with ruff
        run: |
          python -m ruff check \
            --select F401,F841,F821,F823,F811,F541,TID251,UP035,UP006,UP007,UP045 \
            python/tokenspeed/runtime

      - name: Check release orchestration
        run: |
          python -m pip install "pytest>=9" packaging cryptography pyyaml
          python -m pytest -q test/ci_system/test_weekly_release.py test/ci_system/test_engine_release.py test/ci_system/test_nightly_release.py

      - name: Lint scheduler Python and file starts
        run: |
          python -m ruff check tokenspeed-scheduler
          python - <<'PY'
          import subprocess
          from pathlib import Path

          suffixes = {".py", ".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp", ".hxx"}
          files = subprocess.check_output(["git", "ls-files", "tokenspeed-scheduler"], text=True).splitlines()
          blank_starts = []
          relative_imports = []
          for name in files:
              path = Path(name)
              if path.suffix in suffixes and path.read_bytes().startswith((b"\n", b"\r\n")):
                  blank_starts.append(name)
              if path.suffix == ".py":
                  for line_no, line in enumerate(path.read_text().splitlines(), 1):
                      if line.startswith(("from .", "import .")):
                          relative_imports.append(f"{name}:{line_no}: {line}")

          errors = []
          if blank_starts:
              errors.append("files must not start with a blank line:\n" + "\n".join(blank_starts))
          if relative_imports:
              errors.append("scheduler Python must use absolute imports:\n" + "\n".join(relative_imports))
          if errors:
              raise SystemExit("\n\n".join(errors))
          PY

  # Sharded so the syntax check fits in the lint job's wall time; the
  # pre-commit clang-format hook in the lint job checks formatting.
  scheduler-cpp:
    needs: changes
    if: needs.changes.outputs.scheduler_cpp == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install scheduler C++ lint tools
        run: |
          python -m pip install "nanobind>=2.13.0" tokenspeed-spdlog==1.15.1
          sudo apt-get update
          sudo apt-get install -y clang-tools cmake ninja-build

      - name: Configure scheduler compile database
        run: |
          cmake -S tokenspeed-scheduler -B tokenspeed-scheduler/build \
            -G Ninja \
            -DTOKENSPEED_SCHEDULER_BUILD_TESTS=ON \
            -DTOKENSPEED_SCHEDULER_BUILD_PYTHON=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Syntax-only: clang-tidy's default static analyzer took ~1h and its
      # warnings never failed the job.
      - name: Check scheduler C++ translation units
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          git ls-files tokenspeed-scheduler | grep -E '\.(c|cc|cpp|cxx)$' |
            awk -v shard="$SHARD" -v shards="$SHARDS" 'NR % shards == shard' |
            xargs -r -n 1 -P "$(nproc)" sh -c '
              echo "clang-check: $1"
              clang-check -p tokenspeed-scheduler/build "$1"
            ' sh
