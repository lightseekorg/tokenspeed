name: Slurm Dispatch

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional pull request number or URL; blank runs latest main"
        required: false
        default: ""
        type: string
      container_image:
        description: "Optional immutable ghcr.io/lightseekorg/tokenspeed-runner image override"
        required: false
        default: ""
        type: string
      cluster:
        description: "Slurm cluster"
        required: true
        default: gb200
        type: choice
        options:
          - gb200
          - gb300
      yaml:
        description: "Optional single CI YAML; off runs the bulk task selection"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - test/ci/eval/deepseek-v4-flash-evalscope-gsm8k.yaml
          - test/ci/eval/deepseek-v4-flash-mtp-evalscope-gsm8k.yaml
          - test/ci/eval/glm-5.3-flash-fp8-tp4ep4-evalscope-aime26-nvidia.yaml
          - test/ci/eval/glm-5.2-nvfp4-mtp-evalscope-aime26.yaml
          - test/ci/eval/gpt-oss-120b-mxfp4-evalscope-gpqa-diamond.yaml
          - test/ci/eval/inkling-nvfp4-mtp-evalscope-aime25.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-dflash-evalscope-aime25.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-aime25.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-gpqa-diamond.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-gsm8k.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-mmlu.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-ocr-bench.yaml
          - test/ci/eval/kimi-k3-mxfp4-tp16-four-node-evalscope-aime26-slurm.yaml
          - test/ci/eval/kimi-k3-mxfp4-dspark-tp8-two-node-kvv-mmmu-pro-vision-gb300-slurm.yaml
          - test/ci/eval/kimi-k3-mxfp4-dspark-tp8-two-node-kvv-ocr-bench-gb300-slurm.yaml
          - test/ci/eval/kimi-k3-mxfp4-tp8-two-node-evalscope-aime26-gb300-slurm.yaml
          - test/ci/eval/kimi-k3-nvfp4-dspark-tp8-two-node-evalscope-aime26-gb300-slurm.yaml
          - test/ci/eval/kimi-k3-nvfp4-tp8-two-node-evalscope-aime26-gb300-slurm.yaml
          - test/ci/eval/minimax-m3-nvfp4-dspark-evalscope-aime26.yaml
          - test/ci/eval/minimax-m3-nvfp4-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-122b-a10b-nvfp4-epd-1e1p2d-evalscope-ocr-bench.yaml
          - test/ci/eval/qwen3.5-122b-a10b-nvfp4-evalscope-ocr-bench.yaml
          - test/ci/eval/qwen3.5-35b-a3b-fp8-deepep-tp2dp2ep4-evalscope-gsm8k.yaml
          - test/ci/eval/qwen3.5-397b-a17b-nvfp4-dp4ep4-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-397b-a17b-nvfp4-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-397b-a17b-nvfp4-pd-1p1d-evalscope-aime25.yaml
          - test/ci/eval/qwen3.8-flash-next-fp8-evalscope-gsm8k.yaml
          - test/ci/perf/glm-5.3-flash-fp8-mtp-tp4ep4-sharegpt-nvidia.yaml
          - test/ci/perf/qwen3.5-397b-a17b-nvfp4-evalscope-agentic-b200-8gpu.yaml
          - test/ci/perf/qwen3.5-397b-a17b-nvfp4-evalscope-agentic.yaml
          - test/ci/perf/qwen3.5-397b-a17b-nvfp4-evalscope-longctx.yaml
          - test/ci/ut/qwen3.5-122b-a10b-nvfp4-epd-1e1p2d.yaml
          - test/ci/ut/qwen3.5-397b-a17b-nvfp4-pd-1p1d.yaml
          - test/ci/ut/ut-runtime-1gpu.yaml
          - test/ci/ut/ut-runtime-2gpu.yaml
          - test/ci/ut/ut-runtime-prefix-cache-e2e.yaml
          - test/ci/ut/ut-tokenspeed-kernel.yaml
      runners:
        description: "Logical bulk runners; GB300 maps B200/GB200 labels to matching GB300 runners"
        required: true
        default: "b200-4gpu,gb200-4gpu"
        type: string
      task_types:
        description: "Comma-separated task types (ut,server_smoke,eval,perf)"
        required: true
        default: "eval,perf"
        type: string
      match:
        description: "Optional comma-separated task/model substrings"
        required: false
        type: string
      include_mmlu:
        description: "Include long-running MMLU tasks"
        required: true
        default: false
        type: boolean
      trigger:
        description: "Optional task trigger filter"
        required: true
        default: all
        type: choice
        options:
          - all
          - manual
          - nightly
          - debug
          - per-commit
          - slurm

concurrency:
  group: slurm-dispatch-${{ inputs.cluster }}-${{ inputs.pr || 'main' }}-${{ inputs.yaml }}-${{ inputs.runners }}-${{ inputs.match }}-${{ inputs.container_image || 'default-image' }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ${{ inputs.cluster == 'gb300' && 'slurm-dispatch-gb300' || 'slurm-dispatch' }}
    timeout-minutes: 720
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@v4
        with:
          # pr_worktree fetches and merges the requested private-repo PR below.
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Submit and wait for Slurm tasks
        env:
          PR: ${{ inputs.pr }}
          CONTAINER_IMAGE: ${{ inputs.container_image }}
          CLUSTER: ${{ inputs.cluster }}
          YAML_SELECTION: ${{ inputs.yaml }}
          RUNNERS: ${{ inputs.runners }}
          TASK_TYPES: ${{ inputs.task_types }}
          MATCH: ${{ inputs.match }}
          INCLUDE_MMLU: ${{ inputs.include_mmlu }}
          TRIGGER: ${{ inputs.trigger }}
        run: |
          set -euo pipefail
          if [ -n "$CONTAINER_IMAGE" ]; then
            [[ "$CONTAINER_IMAGE" =~ ^ghcr\.io/lightseekorg/tokenspeed-runner:[A-Za-z0-9_][A-Za-z0-9._-]{0,127}@sha256:[0-9a-f]{64}$ ]] || {
              echo "container_image must be an immutable ghcr.io/lightseekorg/tokenspeed-runner image" >&2
              exit 2
            }
            export TS_CI_CONTAINER_IMAGE="$CONTAINER_IMAGE"
          fi
          args=(--wait --report-dir "$RUNNER_TEMP/slurm-report")
          [ -z "$PR" ] || args+=(--pr "$PR")

          case "$CLUSTER" in
            gb200)
              runner_prefixes=(b200- gb200- slurm-gb200-)
              ;;
            gb300)
              runner_prefixes=(gb300- slurm-gb300-)
              coordinator_user=${USER:-$(id -un)}
              export TS_CI_ARTIFACT_ROOT="/data/home/$coordinator_user/tokenspeed-slurm"
              export TS_CI_CACHE_DIR="/data/home/$coordinator_user/tokenspeed-cache"
              ;;
            *)
              echo "Unsupported Slurm cluster: $CLUSTER" >&2
              exit 2
              ;;
          esac

          runner_is_supported() {
            local runner=$1 prefix
            for prefix in "${runner_prefixes[@]}"; do
              [[ "$runner" == "$prefix"* ]] && return 0
            done
            return 1
          }

          gb300_runner_for() {
            local runner=$1
            case "$runner" in
              b200-*) echo "gb300-${runner#b200-}" ;;
              gb200-*) echo "gb300-${runner#gb200-}" ;;
              slurm-b200-*) echo "slurm-gb300-${runner#slurm-b200-}" ;;
              slurm-gb200-*) echo "slurm-gb300-${runner#slurm-gb200-}" ;;
              gb300-*|slurm-gb300-*) echo "$runner" ;;
              *) return 1 ;;
            esac
          }

          if [ "$YAML_SELECTION" != off ]; then
            args+=(--config "$YAML_SELECTION")
            yaml_metadata_output=$(
              python3 - "$YAML_SELECTION" "$CLUSTER" "$PR" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "test/ci_system")
          from pipeline import normalize_task
          from slurm_submit import pr_worktree

          repo = Path.cwd()
          selection = Path(sys.argv[1])
          pr = sys.argv[3]
          if pr:
              with pr_worktree(repo, pr) as checkout:
                  task = normalize_task(checkout / selection, checkout)
          else:
              task = normalize_task(repo / selection, repo)
          prefixes = {
              "gb200": ("b200-", "gb200-", "slurm-gb200-"),
              "gb300": (
                  "b200-",
                  "gb200-",
                  "slurm-b200-",
                  "slurm-gb200-",
                  "gb300-",
                  "slurm-gb300-",
              ),
          }[sys.argv[2]]
          print(f"type:{task['type']}")
          for label in task["runner"]["labels"]:
              if label.startswith(prefixes):
                  print(label)
          PY
            )
            mapfile -t yaml_metadata <<< "$yaml_metadata_output"
            [[ "${yaml_metadata[0]-}" == type:* ]] || {
              echo "Failed to read task metadata from $YAML_SELECTION" >&2
              exit 2
            }
            yaml_task_type="${yaml_metadata[0]#type:}"
            yaml_runners=("${yaml_metadata[@]:1}")
            ((${#yaml_runners[@]})) || {
              echo "No supported Slurm runners declared by $YAML_SELECTION" >&2
              exit 2
            }
            args+=(--type "$yaml_task_type")
            if [ "$CLUSTER" = gb300 ]; then
              selected_runners=()
              if [ "${RUNNERS//[[:space:]]/}" = "b200-4gpu,gb200-4gpu" ]; then
                selected_runners=("${yaml_runners[@]}")
              else
                IFS=',' read -ra values <<< "$RUNNERS"
                for value in "${values[@]}"; do
                  value="${value//[[:space:]]/}"
                  [ -z "$value" ] && continue
                  matches=0
                  for yaml_runner in "${yaml_runners[@]}"; do
                    effective_runner=$(gb300_runner_for "$yaml_runner") || continue
                    if [ "$value" = "$yaml_runner" ] || [ "$value" = "$effective_runner" ]; then
                      for selected_runner in "${selected_runners[@]}"; do
                        [ "$selected_runner" != "$yaml_runner" ] || {
                          echo "Runner $value selects $yaml_runner more than once" >&2
                          exit 2
                        }
                      done
                      selected_runners+=("$yaml_runner")
                      ((matches += 1))
                    fi
                  done
                  ((matches == 1)) || {
                    echo "Runner $value does not identify exactly one runner declared by $YAML_SELECTION" >&2
                    exit 2
                  }
                done
              fi
              for yaml_runner in "${selected_runners[@]}"; do
                effective_runner=$(gb300_runner_for "$yaml_runner") || {
                  echo "Runner $yaml_runner cannot run on the GB300 cluster" >&2
                  exit 2
                }
                args+=(--runner-alias "$yaml_runner=$effective_runner")
              done
            else
              for value in "${yaml_runners[@]}"; do
                args+=(--runner "$value")
              done
            fi
          else
            args+=(--all)
            IFS=',' read -ra values <<< "$RUNNERS"
            for value in "${values[@]}"; do
              value="${value//[[:space:]]/}"
              [ -z "$value" ] && continue
              if [ "$CLUSTER" = gb300 ]; then
                effective_runner=$(gb300_runner_for "$value") || {
                  echo "Runner $value cannot run on the GB300 cluster" >&2
                  exit 2
                }
                args+=(--runner-alias "$value=$effective_runner")
              else
                runner_is_supported "$value" || {
                  echo "Runner $value is not supported by the $CLUSTER cluster" >&2
                  exit 2
                }
                args+=(--runner "$value")
              fi
            done

            IFS=',' read -ra values <<< "$TASK_TYPES"
            for value in "${values[@]}"; do
              value="${value//[[:space:]]/}"
              [ -z "$value" ] || args+=(--type "$value")
            done

            IFS=',' read -ra values <<< "$MATCH"
            for value in "${values[@]}"; do
              value="${value#"${value%%[![:space:]]*}"}"
              value="${value%"${value##*[![:space:]]}"}"
              [ -z "$value" ] || args+=(--match "$value")
            done

            [ "$INCLUDE_MMLU" = true ] || args+=(--exclude-match mmlu)
            [ "$TRIGGER" = all ] || args+=(--trigger "$TRIGGER")
          fi
          exec test/ci/run_slurm.sh "${args[@]}"

      - name: Publish job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/slurm-report/summary.md" ]; then
            cat "$RUNNER_TEMP/slurm-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Slurm dispatcher exited before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Slurm results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slurm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slurm-report
          if-no-files-found: warn
