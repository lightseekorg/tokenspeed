name: NVIDIA B200 Tests

# Split vendor CI into separate workflows so either side can be rerun without
# waiting for the other side's jobs to finish.
on:
  push:
    branches: [main]
    paths:
      - "python/pyproject.toml"
      - "python/tokenspeed/**"
      - "tokenspeed-kernel/**"
      - "tokenspeed-kernel-amd/**"
      - "tokenspeed-mla/**"
      - "tokenspeed-engine/**"
      - "tokenspeed-scheduler/**"
      - "test/**"
      - ".github/workflows/amd-mi350-tests.yml"
      - ".github/workflows/amd-mi450-tests.yml"
      - ".github/workflows/nvidia-b200-tests.yml"
      - ".github/workflows/nvidia-arm-tests.yml"
      - ".github/workflows/run-ci-task-matrix.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "python/pyproject.toml"
      - "python/tokenspeed/**"
      - "tokenspeed-kernel/**"
      - "tokenspeed-kernel-amd/**"
      - "tokenspeed-mla/**"
      - "tokenspeed-engine/**"
      - "tokenspeed-scheduler/**"
      - "test/**"
      - ".github/workflows/amd-mi350-tests.yml"
      - ".github/workflows/amd-mi450-tests.yml"
      - ".github/workflows/nvidia-b200-tests.yml"
      - ".github/workflows/nvidia-arm-tests.yml"
      - ".github/workflows/run-ci-task-matrix.yml"
  workflow_dispatch:
    inputs:
      trigger:
        description: "CI task trigger to run"
        required: false
        default: manual
        type: choice
        options:
          - manual
          - debug

permissions:
  contents: read
  pull-requests: read

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  CUDA_VERSION: 13.0.1
  TOKENSPEED_B200_RUNNER_LABEL: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}

concurrency:
  group: pr-test-nvidia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    # Run jobs for pull requests, or for push/manual events in the official
    # repository or a repository whose full name matches TOKENSPEED_CI_REPOSITORY.
    if: |
      (
        github.event_name == 'pull_request' ||
        github.repository == 'lightseekorg/tokenspeed' ||
        github.repository == vars.TOKENSPEED_CI_REPOSITORY
      )
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      unit_matrix: ${{ steps.scan.outputs.unit_matrix }}
      unit_has_tasks: ${{ steps.scan.outputs.unit_has_tasks }}
      model_matrix: ${{ steps.scan.outputs.model_matrix }}
      model_has_tasks: ${{ steps.scan.outputs.model_has_tasks }}
      install_tokenspeed_mla_from_source: ${{ steps.changes.outputs.install_tokenspeed_mla_from_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install scan dependency
        # pypi.org occasionally returns "Content-Type: Unknown" for the simple
        # index, which strict pip>=22 refuses to parse. Retry a few times.
        run: |
          for i in 1 2 3 4 5; do
            python3 -m pip install pyyaml && exit 0
            echo "pyyaml install attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/tokenspeed-changed-files.txt"
          case "${{ github.event_name }}" in
            pull_request)
              gh api \
                "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate \
                -q '.[] | .filename, (.previous_filename // empty)' \
                > "$changed_files"
              ;;
            push)
              gh api \
                "/repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}" \
                -q '.files[] | .filename, (.previous_filename // empty)' \
                > "$changed_files"
              ;;
            *)
              : > "$changed_files"
              ;;
          esac
          full_tests=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            # Reviewers widen the tests with a label or description lines.
            full_tests=$(python3 test/ci_system/pr_test_scope.py \
              --repository "${{ github.repository }}" \
              --pull-request "${{ github.event.pull_request.number }}" \
              --changed-files "$changed_files")
          fi
          echo "full_tests=$full_tests" >> "$GITHUB_OUTPUT"
          full_tests_flag=
          if [ "$full_tests" = true ]; then full_tests_flag=--full-tests; fi
          python3 test/ci_system/ci_path_filter.py $full_tests_flag \
            --runner-group nvidia-x86 \
            --event-name "${{ github.event_name }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            "$changed_files" >> "$GITHUB_OUTPUT"

      - name: Build task matrix
        id: scan
        if: steps.changes.outputs.should_run == 'true'
        env:
          TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS: h100,b300,${{ vars.TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS }}
        run: |
          for stage in \
            unit:unit-test \
            model:model-test; do
            output=${stage%%:*}
            workflow_stage=${stage#*:}
            matrix=$(python3 test/ci_system/pipeline.py scan \
              --root test/ci \
              --changed-files "$RUNNER_TEMP/tokenspeed-changed-files.txt" \
              ${{ steps.changes.outputs.full_tests == 'true' && '--full-tests' || '' }} \
              --trigger "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.trigger || github.event_name == 'push' && 'post-submit' || 'per-commit' }}" \
              --runner-group "nvidia-x86" \
              --workflow-stage "$workflow_stage")
            echo "${output}_matrix=${matrix}" >> "$GITHUB_OUTPUT"
            printf '%s' "$matrix" | python3 -c "import json, sys; print('${output}_has_tasks=' + ('true' if json.load(sys.stdin).get('include') else 'false'))" >> "$GITHUB_OUTPUT"
          done

  unit-test:
    needs: scan
    if: |
      needs.scan.outputs.should_run == 'true' &&
      needs.scan.outputs.unit_has_tasks == 'true' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (
        github.event_name == 'pull_request' ||
        github.repository == 'lightseekorg/tokenspeed' ||
        github.repository == vars.TOKENSPEED_CI_REPOSITORY
      ) &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.unit_matrix }}
      install_tokenspeed_mla_from_source: ${{ needs.scan.outputs.install_tokenspeed_mla_from_source }}
      b200_runner_label: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}
    secrets: inherit

  model-test:
    needs: [scan, unit-test]
    if: |
      !cancelled() &&
      needs.scan.result == 'success' &&
      needs.scan.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        needs.unit-test.result == 'success' ||
        needs.scan.outputs.unit_has_tasks != 'true'
      ) &&
      needs.scan.outputs.model_has_tasks == 'true'
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.model_matrix }}
      timeout_minutes: 120
      install_tokenspeed_mla_from_source: ${{ needs.scan.outputs.install_tokenspeed_mla_from_source }}
      b200_runner_label: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}
    secrets: inherit

  b300-canary:
    # Contributor-reachable probe on the 8x B300 scale set.
    if: github.event_name == 'pull_request'
    runs-on: b300deepswe-8gpu
    timeout-minutes: 180
    steps:
      - name: Runner probe
        run: |
          set -uo pipefail
          echo "B300-CANARY pod=${POD_IP:-} runner=${RUNNER_NAME:-}"
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/probe.sh"
          bash "$RUNNER_TEMP/probe.sh"

  finish:
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (
        github.event_name == 'pull_request' ||
        github.repository == 'lightseekorg/tokenspeed' ||
        github.repository == vars.TOKENSPEED_CI_REPOSITORY
      )
    needs: [unit-test, model-test]
    runs-on: ubuntu-latest
    steps:
      - name: Finish
        env:
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          MODEL_TEST_RESULT: ${{ needs.model-test.result }}
        run: |
          for result in "$UNIT_TEST_RESULT" "$MODEL_TEST_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "PR Test did not finish successfully: dependency result=$result"
              exit 1
            fi
          done
          echo "PR Test finished."
