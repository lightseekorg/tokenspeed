name: AMD Kernel Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "tokenspeed-kernel/**"
      - "tokenspeed-kernel-amd/**"
      - "test/ci_system/kernel_benchmark_*.py"
      - "test/ci_system/cleanup_amd_gpu_state.sh"
      - "test/ci_system/install_kernel_benchmark_rocm.sh"
      - ".github/workflows/kernel-benchmark-amd.yml"
      - ".github/workflows/kernel-benchmark-comment.yml"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Target branch commit or ref"
        required: true
        default: main
        type: string
      candidate_ref:
        description: "Candidate commit or ref"
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

concurrency:
  group: kernel-benchmark-amd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  benchmark:
    if: |
      (github.repository == 'lightseekorg/tokenspeed' ||
       github.repository == vars.TOKENSPEED_CI_REPOSITORY) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository))
    name: Compare merge base and candidate
    runs-on: amd-mi355-1gpu-bench
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      CUDA_VISIBLE_DEVICES: "0"
    steps:
      - name: Checkout merge revision and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch immutable comparison revisions
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules origin "$BASE_REF" "$CANDIDATE_REF"
          git cat-file -e "${BASE_REF}^{commit}"
          git cat-file -e "${CANDIDATE_REF}^{commit}"

      - name: Clear stale AMD GPU processes
        run: bash test/ci_system/cleanup_amd_gpu_state.sh

      - name: Prepare ROCm benchmark environment
        run: bash test/ci_system/install_kernel_benchmark_rocm.sh

      - name: Run paired kernel benchmarks
        id: benchmark
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/kernel-benchmark-results"
          work_dir="${RUNNER_TEMP}/kernel-benchmark-work"
          args=(
            --repo "$GITHUB_WORKSPACE"
            --base-ref "$BASE_REF"
            --candidate-ref "$CANDIDATE_REF"
            --suite tokenspeed-kernel/benchmarks/amd/gfx950.json
            --output-dir "$output_dir"
            --work-dir "$work_dir"
            --environment-mode venv
            --repository "$GITHUB_REPOSITORY"
            --github-run-id "$GITHUB_RUN_ID"
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [ -n "$PR_NUMBER" ]; then
            args+=(--pull-request-number "$PR_NUMBER")
          fi
          if [ -n "$MERGE_SHA" ]; then
            args+=(--merge-sha "$MERGE_SHA")
          fi
          set +e
          python3 test/ci_system/kernel_benchmark_ci.py "${args[@]}"
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "output_dir=${output_dir}" >> "$GITHUB_OUTPUT"

      - name: Add benchmark job summary
        if: always() && steps.benchmark.outputs.output_dir != ''
        run: |
          summary="${{ steps.benchmark.outputs.output_dir }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        if: always() && steps.benchmark.outputs.output_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmark-amd-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.benchmark.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean comparison worktrees
        if: always()
        run: |
          git worktree prune
          rm -rf "${RUNNER_TEMP}/kernel-benchmark-work"

      - name: Apply benchmark decision
        if: always()
        env:
          BENCHMARK_EXIT_CODE: ${{ steps.benchmark.outputs.exit_code || '2' }}
        run: exit "$BENCHMARK_EXIT_CODE"
