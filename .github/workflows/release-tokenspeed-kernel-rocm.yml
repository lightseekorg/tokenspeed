name: Build and Release tokenspeed-kernel for ROCm

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Build ROCm 7.2 wheels with a .postYYYYMMDD version; enable publish_github on main to publish."
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Git tag prefix to create or update. Defaults to tokenspeed-kernel-v<version>."
        required: false
        type: string
      version_date:
        description: "Version date override for development builds, formatted as YYYYMMDD."
        required: false
        type: string
      prerelease:
        description: "Mark a stable GitHub release as a prerelease. Development versions are always prereleases."
        required: false
        default: false
        type: boolean
      publish_github:
        description: "Publish ROCm 7.2 distributions to lightseekorg/whl."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ROCM_VARIANT: rocm72

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04-32core-x64
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_date: ${{ steps.metadata.outputs.version_date }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      nightly: ${{ steps.metadata.outputs.nightly }}
      amd_version: ${{ steps.metadata.outputs.amd_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build metadata dependencies
        run: python -m pip install --upgrade "setuptools<82" wheel packaging

      - name: Resolve release metadata
        id: metadata
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
          PUBLISH_GITHUB: ${{ github.event_name == 'schedule' || inputs.publish_github }}
          VERSION_DATE: ${{ inputs.version_date }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$NIGHTLY" = "true" ] && [ "$PUBLISH_GITHUB" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Nightly publication requires main." >&2
            exit 1
          fi
          version_date="$VERSION_DATE"
          if [ -z "$version_date" ]; then
            version_date="$(date -u +%Y%m%d)"
          fi

          version=$(
            cd tokenspeed-kernel/python
            TOKENSPEED_KERNEL_BACKEND=rocm \
            TOKENSPEED_KERNEL_NIGHTLY="$NIGHTLY" \
            TOKENSPEED_KERNEL_VERSION_DATE="$version_date" \
            TOKENSPEED_KERNEL_GIT_SHA="$GITHUB_SHA" \
            TOKENSPEED_KERNEL_GIT_BRANCH="$GITHUB_REF_NAME" \
              python setup.py --version
          )

          tag_name="$REQUESTED_TAG"
          if [ "$NIGHTLY" = "true" ]; then
            tag_name="tokenspeed-kernel-nightly-v${version}"
            amd_version=$(python .github/scripts/prepare-kernel-amd-nightly.py \
              --target version . "$version_date")
            echo "amd_version=${amd_version}" >> "$GITHUB_OUTPUT"
            if [ "$PUBLISH_GITHUB" = "true" ]; then
              for attempt in $(seq 1 60); do
                if python -m pip download --no-deps --only-binary=:all: \
                  --index-url https://lightseek.org/whl/nightly/rocm7.2 \
                  --dest amd-ready "tokenspeed-kernel-amd==${amd_version}"; then
                  break
                fi
                if [ "$attempt" = 60 ]; then
                  echo "The same-date AMD kernel nightly is unavailable; refusing to release the ROCm kernel." >&2
                  exit 1
                fi
                sleep 60
              done
            fi
          elif [ -z "$tag_name" ]; then
            tag_name="tokenspeed-kernel-v${version}"
          fi

          echo "nightly=${NIGHTLY}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_date=${version_date}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"
          echo "Release tag: ${tag_name}-${ROCM_VARIANT}"

  build-wheel:
    name: Build ROCm 7.2 x64 wheel for Python ${{ matrix.python.version }}
    needs: metadata
    runs-on: ubuntu-24.04-32core-x64
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.10"
            tag: cp310-cp310
          - version: "3.11"
            tag: cp311-cp311
          - version: "3.12"
            tag: cp312-cp312
          - version: "3.13"
            tag: cp313-cp313
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python to pin AMD nightly
        if: needs.metadata.outputs.nightly == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin same-date AMD nightly
        if: needs.metadata.outputs.nightly == 'true'
        run: |
          version=$(python .github/scripts/prepare-kernel-amd-nightly.py \
            --target rocm . '${{ needs.metadata.outputs.version_date }}')
          test "$version" = '${{ needs.metadata.outputs.amd_version }}'

      - name: Build wheel in manylinux
        run: |
          mkdir -p dist
          docker run --rm \
            -e PYTHON_TAG=${{ matrix.python.tag }} \
            -e AMD_NIGHTLY_VERSION=${{ needs.metadata.outputs.amd_version }} \
            -e TOKENSPEED_KERNEL_BACKEND=rocm \
            -e TOKENSPEED_KERNEL_NIGHTLY=${{ needs.metadata.outputs.nightly }} \
            -e TOKENSPEED_KERNEL_VERSION_DATE=${{ needs.metadata.outputs.version_date }} \
            -e TOKENSPEED_KERNEL_GIT_SHA=$GITHUB_SHA \
            -e TOKENSPEED_KERNEL_GIT_BRANCH=$GITHUB_REF_NAME \
            -v "$PWD:/workspace" \
            -v "$PWD/dist:/output" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -lc '
              set -euo pipefail

              PYBIN="/opt/python/${PYTHON_TAG}/bin"
              cd /workspace/tokenspeed-kernel/python

              "${PYBIN}/python" -m pip install --upgrade \
                pip "setuptools<82" wheel build twine packaging "apache-tvm-ffi==0.1.13.post3"

              rm -rf build *.egg-info
              "${PYBIN}/python" -m build --wheel --no-isolation --outdir /output

              python_tag="${PYTHON_TAG%%-*}"
              abi_tag="${PYTHON_TAG#*-}"
              "${PYBIN}/python" -m wheel tags \
                --python-tag "${python_tag}" \
                --abi-tag "${abi_tag}" \
                --platform-tag manylinux_2_28_x86_64 \
                --remove /output/*.whl

              wheels=(/output/*.whl)
              if [ "${#wheels[@]}" -ne 1 ]; then
                echo "Expected one wheel, found ${#wheels[@]}" >&2
                exit 1
              fi

              "${PYBIN}/python" - "${wheels[0]}" <<PY
          import os
          import sys
          import zipfile
          from email.parser import BytesParser

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          with zipfile.ZipFile(sys.argv[1]) as wheel:
              metadata_path = next(
                  name
                  for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser().parsebytes(wheel.read(metadata_path))

          requirements = {
              canonicalize_name(requirement.name): requirement
              for requirement in map(
                  Requirement, metadata.get_all("Requires-Dist", [])
              )
          }
          expected = {
              "tokenspeed-kernel-amd": (
                  "==" + os.environ["AMD_NIGHTLY_VERSION"]
                  if os.environ["AMD_NIGHTLY_VERSION"] else ">=0.1.3"
              ),
          }
          for name, specifier in expected.items():
              actual = requirements.get(name)
              if actual is None or str(actual.specifier) != specifier:
                  raise SystemExit(
                      f"{name}: expected {specifier}, found {actual}"
                  )

          forbidden = {
              "flashinfer-python",
              "nvidia-cutlass-dsl",
              "nvidia-ml-py",
              "tokenspeed-deepgemm",
          }
          present = sorted(forbidden & requirements.keys())
          if present:
              raise SystemExit(
                  f"ROCm wheel contains CUDA dependencies: {present}"
              )
          PY

              "${PYBIN}/python" -m twine check "${wheels[0]}"
            '

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: tokenspeed-kernel-${{ env.ROCM_VARIANT }}-wheel-x64-py${{ matrix.python.version }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: metadata
    runs-on: ubuntu-24.04-32core-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin same-date AMD nightly
        if: needs.metadata.outputs.nightly == 'true'
        run: |
          version=$(python .github/scripts/prepare-kernel-amd-nightly.py \
            --target rocm . '${{ needs.metadata.outputs.version_date }}')
          test "$version" = '${{ needs.metadata.outputs.amd_version }}'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade \
            build twine "setuptools<82" wheel packaging "apache-tvm-ffi==0.1.13.post3"
          cd tokenspeed-kernel/python
          TOKENSPEED_KERNEL_BACKEND=rocm \
          TOKENSPEED_KERNEL_NIGHTLY=${{ needs.metadata.outputs.nightly }} \
          TOKENSPEED_KERNEL_VERSION_DATE=${{ needs.metadata.outputs.version_date }} \
          TOKENSPEED_KERNEL_GIT_SHA=$GITHUB_SHA \
          TOKENSPEED_KERNEL_GIT_BRANCH=$GITHUB_REF_NAME \
            python -m build --sdist --no-isolation --outdir ../../dist
          python -m twine check ../../dist/*.tar.gz

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: tokenspeed-kernel-${{ env.ROCM_VARIANT }}-sdist
          path: dist/*.tar.gz

  release:
    name: Create ROCm 7.2 wheelhouse release
    if: github.event_name == 'schedule' || inputs.publish_github
    concurrency:
      group: wheelhouse-publication
      cancel-in-progress: false
    needs: [metadata, build-wheel, build-sdist]
    runs-on: ubuntu-24.04-32core-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tokenspeed-kernel-rocm72-*
          merge-multiple: false

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          RELEASE_REPOSITORY: lightseekorg/whl
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          NIGHTLY: ${{ needs.metadata.outputs.nightly }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          release_tag="${TAG_NAME}-${ROCM_VARIANT}"
          release_title="tokenspeed-kernel ${VERSION} ROCm 7.2"
          prerelease_args=()
          if [ "$NIGHTLY" = "true" ] || [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *.dev* ]] || [[ "$VERSION" == *+* ]]; then
            prerelease_args+=(--prerelease)
          fi

          shopt -s nullglob
          assets=(
            dist/tokenspeed-kernel-"${ROCM_VARIANT}"-wheel-*/*.whl
            dist/tokenspeed-kernel-"${ROCM_VARIANT}"-sdist/*.tar.gz
          )
          shopt -u nullglob

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No distributions found for ${ROCM_VARIANT}" >&2
            exit 1
          fi

          if gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            if [ "${#prerelease_args[@]}" -gt 0 ]; then
              gh release edit "$release_tag" \
                --repo "$RELEASE_REPOSITORY" \
                --prerelease
            fi
            if [ "$NIGHTLY" = "true" ]; then
              # Never replace an indexed wheel: its published SHA256 must stay valid.
              existing_assets=$(gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" --json assets --jq '.assets[].name')
              for asset in "${assets[@]}"; do
                if ! grep -Fxq "$(basename "$asset")" <<< "$existing_assets"; then
                  release_notes=$(gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" --json body --jq .body)
                  if [ "$release_notes" != "$release_title built from lightseekorg/tokenspeed@$SOURCE_SHA" ]; then
                    echo "Cannot complete a nightly release from a different source commit." >&2
                    exit 1
                  fi
                  gh release upload "$release_tag" "$asset" --repo "$RELEASE_REPOSITORY"
                fi
              done
            else
              gh release upload "$release_tag" "${assets[@]}" \
                --repo "$RELEASE_REPOSITORY" \
                --clobber
            fi
          else
            gh release create "$release_tag" "${assets[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_title built from lightseekorg/tokenspeed@$SOURCE_SHA" \
              "${prerelease_args[@]}"
          fi

      - name: Checkout wheel index
        if: needs.metadata.outputs.nightly == 'true'
        uses: actions/checkout@v4
        with:
          repository: lightseekorg/whl
          ref: gh-pages
          path: wheelhouse
          token: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}

      - name: Publish ROCm nightly pip index
        if: needs.metadata.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
        run: |
          test "$(gh api user --jq .login)" = lightseek-bot
          test "$(gh repo view lightseekorg/whl --json visibility --jq .visibility)" = PUBLIC
          gh api "repos/lightseekorg/whl/releases/tags/${TAG_NAME}-rocm72" > nightly-release.json
          python .github/scripts/update-nightly-index.py \
            --package tokenspeed-kernel --variant rocm72 wheelhouse nightly-release.json dist
          cd wheelhouse
          git config user.name lightseek-bot
          git config user.email 243258330+lightseek-bot@users.noreply.github.com
          git add nightly/index.html nightly/rocm7.2/index.html nightly/rocm7.2/tokenspeed-kernel/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached
          if [ -f .pre-commit-config.yaml ]; then
            pre-commit run --all-files
          fi
          git commit -s -m "Publish tokenspeed-kernel ROCm nightly index"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              gh api repos/lightseekorg/whl/contents/nightly/rocm7.2/tokenspeed-kernel/index.html --jq .content | base64 --decode
              gh api repos/lightseekorg/whl/contents/nightly/rocm7.2/index.html --jq .content | base64 --decode
              exit 0
            fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          echo "Could not publish the ROCm nightly index after three attempts." >&2
          exit 1
