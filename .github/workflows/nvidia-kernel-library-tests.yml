name: NVIDIA Kernel Library Tests

on:
  schedule:
    # Check the latest main six times daily in US Pacific time.
    - cron: "0 0,6,9,12,15,18 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

# Serialize single-node runs to preserve capacity for development.
concurrency:
  group: nvidia-gpu-library-tests
  cancel-in-progress: false

jobs:
  native-libraries:
    if: github.repository == 'lightseekorg/tokenspeed'
    runs-on:
      group: Four-GPU Slurm Dispatchers
      labels: slurm-dispatch-4gpu
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Run native library unit tests
        run: |
          set -euo pipefail
          unset SBATCH_GPUS_PER_NODE SLURM_GPUS_PER_NODE
          export TS_CI_ARTIFACT_ROOT="$HOME/tokenspeed-native-library-slurm"
          export TS_CI_CACHE_DIR="$HOME/tokenspeed-native-library-cache"
          export TS_CI_CONTAINER_IMAGE=ghcr.io/lightseekorg/tokenspeed-runner:cu134-torch-2.14.0-flashinfer-0.7.2@sha256:ac52e9279314dd7faa2ad3074f168186ebb84358ad1987db8df5be151e503b0c
          bash test/ci/run_slurm.sh \
            --config test/ci/ut/ut-tokenspeed-kernel-nvidia-arm.yaml \
            --runner slurm-nvidia-arm-4gpu --type ut --trigger slurm \
            --partition batch --time 02:00:00 \
            --wait --report-dir "$RUNNER_TEMP/native-library-report"

      - name: Publish test summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/native-library-report/summary.md" ]; then
            cat "$RUNNER_TEMP/native-library-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvidia-kernel-library-tests
          path: ${{ runner.temp }}/native-library-report
          if-no-files-found: ignore
