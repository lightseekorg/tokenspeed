name: Cleanup Branches

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligible branches without deleting them
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'lightseekorg/tokenspeed' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Closed includes merged PRs. Branches with no PR history expire seven
      # days after the tip commit's committer date, not the branch creation or
      # push time. Default/protected branches and open PR heads/bases are kept.
      - name: Clean up branches
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-branches.js');
            await cleanup({
              github, core, context,
              dryRun: process.env.DRY_RUN === 'true',
              now: Date.now(),
            });
