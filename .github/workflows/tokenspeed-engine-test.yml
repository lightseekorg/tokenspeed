name: Build TokenSpeed Engine Nightly Wheels

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Public main commit to build
        required: true
        type: string
      version_date:
        description: Nightly version date in YYYYMMDD format
        required: true
        type: string

permissions:
  contents: read

jobs:
  wheel:
    name: Engine ${{ matrix.arch }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Prepare nightly metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_DATE: ${{ inputs.version_date }}
        run: |
          python - <<'PYTHON'
          import os
          import re
          import subprocess
          import tomllib
          from datetime import datetime
          from pathlib import Path

          source = Path('source')
          expected = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise ValueError('source_sha must be a full public commit SHA')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=source, text=True).strip()
          if actual != expected:
              raise ValueError(f'Unexpected source commit: {actual}')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD'], cwd=source, check=True)
          date = os.environ['VERSION_DATE']
          if not re.fullmatch(r'[0-9]{8}', date):
              raise ValueError('version_date must be YYYYMMDD')
          datetime.strptime(date, '%Y%m%d')
          path = source / 'tokenspeed-engine/pyproject.toml'
          original = path.read_text()
          project = tomllib.loads(original)['project']
          if project['name'] != 'tokenspeed-engine':
              raise ValueError('Unexpected project')
          version = f"{project['version']}.post{date}"
          updated, count = re.subn(r'^version = "[^"\n]+"$', f'version = "{version}"', original, flags=re.MULTILINE)
          if count != 1:
              raise ValueError('Expected one project version')
          path.write_text(updated)
          print(f'Building tokenspeed-engine {version} from {actual}')
          PYTHON

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          python -m venv .engine-build-env
          .engine-build-env/bin/python -m pip install --upgrade build twine

      - name: Build and validate platform wheel
        env:
          CARGO_BUILD_JOBS: '4'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          .engine-build-env/bin/python -m build source/tokenspeed-engine --wheel --outdir dist
          .engine-build-env/bin/python -m twine check dist/*.whl
          .engine-build-env/bin/python -m pip install --no-deps dist/*.whl
          .engine-build-env/bin/python - <<'PYTHON'
          import subprocess

          import tokenspeed_engine

          result = subprocess.run(
              [str(tokenspeed_engine.host_binary())],
              capture_output=True,
              text=True,
              timeout=20,
          )
          if result.returncode != 1 or '--python is required' not in result.stderr:
              raise RuntimeError(f'Host execution failed: {result}')
          listener = tokenspeed_engine.FrontendListener.bind(
              handshake_address='tcp://127.0.0.1:0',
              input_address='tcp://127.0.0.1:0',
              output_address='tcp://127.0.0.1:0',
              first_engine_index=0,
              num_engines=1,
              routing='round_robin',
              handshake_timeout_s=1.0,
              send_timeout_s=1.0,
          )
          if listener.handshake_address.endswith(':0'):
              raise RuntimeError('Native frontend did not bind an available port')
          print('Native frontend binds sockets and ts-host executes')
          PYTHON

      - uses: actions/upload-artifact@v4
        with:
          name: tokenspeed-engine-${{ matrix.arch }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
