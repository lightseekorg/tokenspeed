name: Build and Release TokenSpeed
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "python/tokenspeed/version.py"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Build a dated nightly with the same-date tokenspeed-kernel dependency."
        type: boolean
        default: false
      replace_nightly:
        description: "Replace existing nightly assets and refresh their pip index hashes (main only)."
        type: boolean
        default: false
      publish_github:
        description: "Publish nightly distributions and the pip index from main."
        type: boolean
        default: true
      version_date:
        description: "Nightly version date override, formatted as YYYYMMDD."
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'lightseekorg/tokenspeed'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      nightly: ${{ steps.metadata.outputs.nightly }}
      version: ${{ steps.metadata.outputs.version }}
      kernel_version: ${{ steps.metadata.outputs.kernel_version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare nightly metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
          REPLACE_NIGHTLY: ${{ inputs.replace_nightly }}
          PUBLISH_GITHUB: ${{ github.event_name == 'schedule' || inputs.publish_github }}
          VERSION_DATE: ${{ inputs.version_date }}
        run: |
          if [ "$REPLACE_NIGHTLY" = "true" ] && { [ "$NIGHTLY" != "true" ] || [ "$PUBLISH_GITHUB" != "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; }; then
            echo "Replacing nightly assets requires nightly publication from main." >&2
            exit 1
          fi
          echo "nightly=${NIGHTLY}" >> "$GITHUB_OUTPUT"
          if [ "$NIGHTLY" != "true" ]; then
            echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PUBLISH_GITHUB" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Nightly publication requires main." >&2
            exit 1
          fi
          python -m pip install --upgrade "setuptools<82" wheel packaging
          version_date="${VERSION_DATE:-$(date -u +%Y%m%d)}"
          kernel_version_here() {
            (
              cd tokenspeed-kernel/python
              TOKENSPEED_KERNEL_BACKEND=cuda \
              TOKENSPEED_KERNEL_NIGHTLY=true \
              TOKENSPEED_KERNEL_VERSION_DATE="$version_date" \
                python setup.py --version
            )
          }
          kernel_version=$(kernel_version_here)
          echo "TokenSpeed nightly ${version_date} requires tokenspeed-kernel==${kernel_version}"

          # The one-hour schedule offset is not a publication-order guarantee.
          for attempt in $(seq 1 60); do
            if python -m pip download --no-deps --only-binary=:all: \
              --index-url https://lightseek.org/whl/nightly \
              --dest kernel-ready "tokenspeed-kernel==${kernel_version}"; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "The same-date kernel nightly is not published; refusing to release TokenSpeed." >&2
              exit 1
            fi
            sleep 60
          done

          # The kernel nightly checks out main at 02:00 UTC and this workflow at
          # 03:00 UTC. A commit that lands in between can move a kernel module the
          # runtime imports, and the runtime wheel then pins a kernel wheel that
          # predates it (2026-10-15: tokenspeed_kernel.ops.gemm._cute_dsl). Build
          # the runtime from the commit the kernel wheel was built from, which its
          # release notes record.
          source_sha=$(gh release view "tokenspeed-kernel-nightly-v${kernel_version}-cu130" \
            --repo lightseekorg/whl --json body --jq .body \
            | grep -oE 'lightseekorg/tokenspeed@[0-9a-f]{40}' | tail -n 1 | cut -d@ -f2 || true)
          if [ -z "$source_sha" ]; then
            echo "The kernel nightly release does not record its source commit; refusing to release TokenSpeed." >&2
            exit 1
          fi
          if [ "$source_sha" != "$GITHUB_SHA" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Building ${GITHUB_REF} as checked out; the kernel nightly was built from ${source_sha}."
              source_sha="$GITHUB_SHA"
            else
              echo "Building from ${source_sha}, the commit the kernel nightly was built from; main is at ${GITHUB_SHA}."
              git fetch --depth 1 origin "$source_sha"
              git checkout --detach "$source_sha"
              if [ "$(kernel_version_here)" != "$kernel_version" ]; then
                echo "tokenspeed-kernel at ${source_sha} is not ${kernel_version}; refusing to release TokenSpeed." >&2
                exit 1
              fi
            fi
          fi
          version=$(python .github/scripts/prepare-tokenspeed-nightly.py \
            . "$version_date" "$kernel_version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "kernel_version=${kernel_version}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "TokenSpeed ${version} requires tokenspeed-kernel==${kernel_version}"

      - name: Build distributions
        run: |
          cd python
          cp ../README.md ../LICENSE .
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: tokenspeed-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    if: github.repository == 'lightseekorg/tokenspeed' && needs.build.outputs.nightly != 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: tokenspeed-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-nightly:
    if: needs.build.outputs.nightly == 'true' && (github.event_name == 'schedule' || inputs.publish_github)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: wheelhouse-publication
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: tokenspeed-dist
          path: dist/tokenspeed-dist

      - name: Publish nightly distributions
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          REPLACE_NIGHTLY: ${{ inputs.replace_nightly }}
        run: |
          test "$(gh api user --jq .login)" = lightseek-bot
          for repository in lightseekorg/whl lightseekorg/tokenspeed; do
            test "$(gh repo view "$repository" --json visibility --jq .visibility)" = PUBLIC
          done
          tag="tokenspeed-nightly-v${VERSION}"
          title="tokenspeed ${VERSION}"
          notes="${title} built from lightseekorg/tokenspeed@${SOURCE_SHA}"
          assets=(dist/tokenspeed-dist/*.whl dist/tokenspeed-dist/*.tar.gz)
          if gh release view "$tag" --repo lightseekorg/whl >/dev/null 2>&1; then
            if [ "$REPLACE_NIGHTLY" = "true" ]; then
              gh release upload "$tag" "${assets[@]}" --repo lightseekorg/whl --clobber
              printf '%s\n\n%s\n' "$notes" \
                "Replacement build; reinstall with --no-cache-dir --force-reinstall if already installed." > release-notes.txt
              gh release edit "$tag" --repo lightseekorg/whl --notes-file release-notes.txt
            else
              existing_assets=$(gh release view "$tag" --repo lightseekorg/whl --json assets --jq '.assets[].name')
              for asset in "${assets[@]}"; do
                if ! grep -Fxq "$(basename "$asset")" <<< "$existing_assets"; then
                  existing_notes=$(gh release view "$tag" --repo lightseekorg/whl --json body --jq .body)
                  if [ "$existing_notes" != "$notes" ]; then
                    echo "Cannot complete a nightly release from a different source commit." >&2
                    exit 1
                  fi
                  gh release upload "$tag" "$asset" --repo lightseekorg/whl
                fi
              done
            fi
          else
            gh release create "$tag" "${assets[@]}" --repo lightseekorg/whl \
              --title "$title" --notes "$notes" --prerelease
          fi
          gh api "repos/lightseekorg/whl/releases/tags/${tag}" > nightly-release.json

      - name: Checkout wheel index
        uses: actions/checkout@v4
        with:
          repository: lightseekorg/whl
          ref: gh-pages
          path: wheelhouse
          token: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}

      - name: Publish nightly pip index
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          REPLACE_NIGHTLY: ${{ inputs.replace_nightly }}
        run: |
          replace_args=()
          if [ "$REPLACE_NIGHTLY" = "true" ]; then
            replace_args+=(--replace)
          fi
          python .github/scripts/update-nightly-index.py "${replace_args[@]}" \
            --package tokenspeed --variant cu130 wheelhouse nightly-release.json dist
          cd wheelhouse
          git config user.name lightseek-bot
          git config user.email 243258330+lightseek-bot@users.noreply.github.com
          git add nightly/index.html nightly/tokenspeed/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached
          if [ -f .pre-commit-config.yaml ]; then
            pre-commit run --all-files
          fi
          git commit -s -m "Publish tokenspeed nightly index"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              gh api repos/lightseekorg/whl/contents/nightly/tokenspeed/index.html --jq .content | base64 --decode
              gh api repos/lightseekorg/whl/contents/nightly/index.html --jq .content | base64 --decode
              exit 0
            fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          echo "Could not publish the nightly index after three attempts." >&2
          exit 1

  check-nightly-rocm:
    if: needs.build.outputs.nightly == 'true' && (github.event_name == 'schedule' || inputs.publish_github)
    needs: [build, publish-nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for same-date ROCm kernel nightly
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ needs.build.outputs.kernel_version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          # CUDA's successful publication does not guarantee ROCm is ready.
          for attempt in $(seq 1 60); do
            if python -m pip download --no-deps --only-binary=:all: \
              --index-url https://lightseek.org/whl/nightly/rocm7.2 \
              --dest kernel-ready "tokenspeed-kernel==${KERNEL_VERSION}"; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "The same-date ROCm kernel nightly is not published; refusing to index TokenSpeed for ROCm." >&2
              exit 1
            fi
            sleep 60
          done

          # The ROCm kernel nightly is its own 02:00 UTC build and can come from a
          # later commit than the one TokenSpeed was built from. Index TokenSpeed
          # for ROCm only when no packaged code differs between the two; a rename
          # counts under both of its paths.
          rocm_sha=$(gh release view "tokenspeed-kernel-nightly-v${KERNEL_VERSION}-rocm72" \
            --repo lightseekorg/whl --json body --jq .body \
            | grep -oE 'lightseekorg/tokenspeed@[0-9a-f]{40}' | tail -n 1 | cut -d@ -f2 || true)
          if [ -z "$rocm_sha" ]; then
            echo "The ROCm kernel nightly release does not record its source commit; refusing to index TokenSpeed for ROCm." >&2
            exit 1
          fi
          if [ "$rocm_sha" != "$SOURCE_SHA" ]; then
            files=""
            for range in "${SOURCE_SHA}...${rocm_sha}" "${rocm_sha}...${SOURCE_SHA}"; do
              files+=$(gh api "repos/lightseekorg/tokenspeed/compare/${range}" \
                --jq 'if (.files | length) >= 300 then "too many files to compare" else .files[] | .filename, (.previous_filename // empty) end')$'\n' \
                || { echo "Cannot compare ${range}; refusing to index TokenSpeed for ROCm." >&2; exit 1; }
            done
            if printf '%s' "$files" | grep -E '^(tokenspeed-kernel/python/|python/tokenspeed/|too many files)'; then
              echo "The ROCm kernel nightly (${rocm_sha}) and TokenSpeed (${SOURCE_SHA}) differ in packaged code; refusing to index TokenSpeed for ROCm." >&2
              exit 1
            fi
            echo "The ROCm kernel nightly was built from ${rocm_sha}; no packaged code differs from ${SOURCE_SHA}."
          fi

  publish-nightly-rocm:
    if: needs.build.outputs.nightly == 'true' && (github.event_name == 'schedule' || inputs.publish_github)
    needs: [build, check-nightly-rocm]
    runs-on: ubuntu-latest
    concurrency:
      group: wheelhouse-publication
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TokenSpeed distributions
        uses: actions/download-artifact@v4
        with:
          name: tokenspeed-dist
          path: dist/tokenspeed-dist

      - name: Checkout wheel index
        uses: actions/checkout@v4
        with:
          repository: lightseekorg/whl
          ref: gh-pages
          path: wheelhouse
          token: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}

      - name: Publish ROCm TokenSpeed nightly index
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          REPLACE_NIGHTLY: ${{ inputs.replace_nightly }}
        run: |
          test "$(gh api user --jq .login)" = lightseek-bot
          gh api "repos/lightseekorg/whl/releases/tags/tokenspeed-nightly-v${VERSION}" > nightly-release.json
          replace_args=()
          if [ "$REPLACE_NIGHTLY" = "true" ]; then
            replace_args+=(--replace)
          fi
          python .github/scripts/update-nightly-index.py "${replace_args[@]}" \
            --package tokenspeed --variant rocm72 wheelhouse nightly-release.json dist
          cd wheelhouse
          git config user.name lightseek-bot
          git config user.email 243258330+lightseek-bot@users.noreply.github.com
          git add nightly/index.html nightly/rocm7.2/index.html nightly/rocm7.2/tokenspeed/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached
          if [ -f .pre-commit-config.yaml ]; then
            pre-commit run --all-files
          fi
          git commit -s -m "Publish tokenspeed ROCm nightly index"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              gh api repos/lightseekorg/whl/contents/nightly/rocm7.2/tokenspeed/index.html --jq .content | base64 --decode
              gh api repos/lightseekorg/whl/contents/nightly/rocm7.2/index.html --jq .content | base64 --decode
              exit 0
            fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          echo "Could not publish the ROCm TokenSpeed nightly index after three attempts." >&2
          exit 1
