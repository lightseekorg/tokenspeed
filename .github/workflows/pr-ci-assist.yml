name: PR CI Assistance

on:
  workflow_run:
    workflows:
      - PR CI Plan
      - Lint
      - PR Commit Trailers
      - AMD Tests
      - NVIDIA B200 Tests
      - PR Test NVIDIA ARM
      - NVIDIA GB200 Tests
      - NVIDIA GB300 Tests
      - K8s Dispatch
      - Slurm Dispatch
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Repository-branch PR number"
        required: true
        type: string
      action:
        description: "Report readiness or diagnose a failed selected task"
        required: true
        default: report
        type: choice
        options: [report, dispatch]
      config:
        description: "Selected test/ci task YAML for dispatch"
        required: false
        type: string
      runner:
        description: "Exact selected runner label"
        required: false
        type: string
      backend:
        description: "Dispatch backend; another GPU family is diagnostic only"
        required: true
        default: auto
        type: choice
        options: [auto, k8s, gb200, gb300]
      attempt:
        description: "Bounded diagnostic attempt"
        required: true
        default: '1'
        type: choice
        options: ['1', '2']

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  resolve:
    if: >-
      github.repository == 'lightseekorg/tokenspeed'
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Resolve repository-branch PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: python3 .github/scripts/pr-ci-assist.py resolve

  assist:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    concurrency:
      group: pr-ci-assist-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install catalog dependency
        run: python3 -m pip install pyyaml

      - name: Evaluate current PR
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          PR: ${{ needs.resolve.outputs.pr }}
          CI_ACTION: ${{ inputs.action || 'report' }}
          CI_CONFIG: ${{ inputs.config }}
          CI_RUNNER: ${{ inputs.runner }}
          CI_BACKEND: ${{ inputs.backend || 'auto' }}
          CI_ATTEMPT: ${{ inputs.attempt || '1' }}
          TOKENSPEED_B200_RUNNER_LABEL: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}
          TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS: ${{ vars.TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS }}
          TOKENSPEED_CI_GB300_SLURM_PER_COMMIT_ENABLED: ${{ vars.TOKENSPEED_CI_GB300_SLURM_PER_COMMIT_ENABLED }}
        run: python3 .github/scripts/pr-ci-assist.py
