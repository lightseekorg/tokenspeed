name: AMD Kernel Benchmark

# Kept apart from AMD Tests so the benchmark starts alongside unit tests, and
# so its `workflow_run` completion lets the PR comment publish without waiting
# for model tests.
on:
  push:
    branches: [main]
    paths:
      - "python/pyproject.toml"
      - "python/tokenspeed/**"
      - "tokenspeed-kernel/**"
      - "tokenspeed-kernel-amd/**"
      - "tokenspeed-scheduler/**"
      - "test/**"
      - ".github/workflows/amd-kernel-benchmark.yml"
      - ".github/workflows/run-ci-task-matrix.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "python/pyproject.toml"
      - "python/tokenspeed/**"
      - "tokenspeed-kernel/**"
      - "tokenspeed-kernel-amd/**"
      - "tokenspeed-scheduler/**"
      - "test/**"
      - ".github/workflows/amd-kernel-benchmark.yml"
      - ".github/workflows/run-ci-task-matrix.yml"
  workflow_dispatch:

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

concurrency:
  group: pr-test-amd-kernel-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    # Run jobs for pull requests, or for push/manual events in the official
    # repository or a repository whose full name matches TOKENSPEED_CI_REPOSITORY.
    if: |
      github.event_name == 'pull_request' ||
      github.repository == 'lightseekorg/tokenspeed' ||
      github.repository == vars.TOKENSPEED_CI_REPOSITORY
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      kernel_benchmark_matrix: ${{ steps.scan.outputs.kernel_benchmark_matrix }}
      kernel_benchmark_has_tasks: ${{ steps.scan.outputs.kernel_benchmark_has_tasks }}
      install_tokenspeed_mla_from_source: ${{ steps.changes.outputs.install_tokenspeed_mla_from_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install scan dependency
        # pypi.org occasionally returns "Content-Type: Unknown" for the simple
        # index, which strict pip>=22 refuses to parse. Retry a few times.
        run: |
          for i in 1 2 3 4 5; do
            python3 -m pip install pyyaml && exit 0
            echo "pyyaml install attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/tokenspeed-changed-files.txt"
          case "${{ github.event_name }}" in
            pull_request)
              gh api \
                "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate \
                -q '.[] | .filename, (.previous_filename // empty)' \
                > "$changed_files"
              ;;
            push)
              gh api \
                "/repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}" \
                -q '.files[] | .filename, (.previous_filename // empty)' \
                > "$changed_files"
              ;;
            *)
              : > "$changed_files"
              ;;
          esac
          python3 test/ci_system/ci_path_filter.py \
            --runner-group amd \
            --event-name "${{ github.event_name }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            "$changed_files" >> "$GITHUB_OUTPUT"

      - name: Build task matrix
        id: scan
        if: steps.changes.outputs.should_run == 'true'
        env:
          TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS: ${{ vars.TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS }}
        run: |
          matrix=$(python3 test/ci_system/pipeline.py scan \
            --root test/ci \
            --changed-files "$RUNNER_TEMP/tokenspeed-changed-files.txt" \
            --trigger "${{ github.event_name == 'workflow_dispatch' && 'manual' || 'per-commit' }}" \
            --runner-group "amd" \
            --workflow-stage "kernel-benchmark")
          echo "kernel_benchmark_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c "import json, sys; print('kernel_benchmark_has_tasks=' + ('true' if json.load(sys.stdin).get('include') else 'false'))" >> "$GITHUB_OUTPUT"

  kernel-benchmark:
    needs: scan
    if: |
      needs.scan.outputs.should_run == 'true' &&
      needs.scan.outputs.kernel_benchmark_has_tasks == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.kernel_benchmark_matrix }}
      install_tokenspeed_mla_from_source: ${{ needs.scan.outputs.install_tokenspeed_mla_from_source }}
      comparison_base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
      comparison_candidate_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.event.after || github.sha }}
    secrets: inherit

  # The default-branch ruleset requires a check named `finish`, which matches
  # this job as well as the other PR test workflows' gates. Keep the name so a
  # benchmark failure blocks merging.
  finish:
    if: |
      always() &&
      (
        github.event_name == 'pull_request' ||
        github.repository == 'lightseekorg/tokenspeed' ||
        github.repository == vars.TOKENSPEED_CI_REPOSITORY
      )
    needs: [scan, kernel-benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Finish
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          KERNEL_BENCHMARK_RESULT: ${{ needs.kernel-benchmark.result }}
        run: |
          # A failed scan skips the benchmark; do not let that pass the gate.
          if [[ "$SCAN_RESULT" != "success" ]]; then
            echo "Kernel benchmark scan did not succeed: result=$SCAN_RESULT"
            exit 1
          fi
          if [[ "$KERNEL_BENCHMARK_RESULT" != "success" && "$KERNEL_BENCHMARK_RESULT" != "skipped" ]]; then
            echo "Kernel benchmark did not finish successfully: result=$KERNEL_BENCHMARK_RESULT"
            exit 1
          fi
          echo "Kernel benchmark finished."
