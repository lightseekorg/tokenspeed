name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
      - "test/ci_system/ci_speed_dashboard.py"
  schedule:
    # Refresh the CI speed dashboard (docs/public/ci) with the latest runs.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      # Completed runs never change, so the dashboard keeps what it fetched
      # and reads only new runs (the token allows ~1000 requests an hour).
      - name: Restore CI speed cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .ci-speed-cache
          key: ci-speed-${{ github.run_id }}
          restore-keys: ci-speed-

      # A failed refresh must not block the docs; the page then says the
      # data was not generated.
      - name: Build CI speed dashboard data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 test/ci_system/ci_speed_dashboard.py
          --repo "${{ github.repository }}"
          --cache .ci-speed-cache
          --out docs/public/ci/data.json
          --max-new-runs 400

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: bun run docs:build

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'lightseekorg/tokenspeed'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
