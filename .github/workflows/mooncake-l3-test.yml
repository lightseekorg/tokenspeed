name: Mooncake L3 Master Test

on:
  push:
    branches: [main]
    paths:
      - "python/tokenspeed/runtime/cache/l3/**"
      - "python/tokenspeed/runtime/cache/l2/executor.py"
      - "python/tokenspeed/runtime/cache/host_storage.py"
      - "python/tokenspeed/runtime/cache/transfer/ownership.py"
      - "python/tokenspeed/runtime/cache/transfer/layout.py"
      - "python/tokenspeed/runtime/engine/rust_host.py"
      - "python/tokenspeed/runtime/execution/device.py"
      - "python/tokenspeed/runtime/utils/server_args.py"
      - "tokenspeed-scheduler/**"
      - "tokenspeed-engine/crates/ts-l3/**"
      - "tokenspeed-engine/crates/ts-metrics/**"
      - "tokenspeed-engine/crates/ts-mooncake/**"
      - "tokenspeed-engine/crates/ts-py/**"
      - "test/l3_test_utils.py"
      - "test/test_host_cache_storage.py"
      - "test/test_l3_tail_roundtrip.py"
      - "test/test_l3_kvstore.py"
      - "test/ci_system/l3_native_release_validation.py"
      - "test/ci_system/test_l3_native_release_validation.py"
      - ".github/workflows/mooncake-l3-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/tokenspeed/runtime/cache/l3/**"
      - "python/tokenspeed/runtime/cache/l2/executor.py"
      - "python/tokenspeed/runtime/cache/host_storage.py"
      - "python/tokenspeed/runtime/cache/transfer/ownership.py"
      - "python/tokenspeed/runtime/cache/transfer/layout.py"
      - "python/tokenspeed/runtime/engine/rust_host.py"
      - "python/tokenspeed/runtime/execution/device.py"
      - "python/tokenspeed/runtime/utils/server_args.py"
      - "tokenspeed-scheduler/**"
      - "tokenspeed-engine/crates/ts-l3/**"
      - "tokenspeed-engine/crates/ts-metrics/**"
      - "tokenspeed-engine/crates/ts-mooncake/**"
      - "tokenspeed-engine/crates/ts-py/**"
      - "test/l3_test_utils.py"
      - "test/test_host_cache_storage.py"
      - "test/test_l3_tail_roundtrip.py"
      - "test/test_l3_kvstore.py"
      - "test/ci_system/l3_native_release_validation.py"
      - "test/ci_system/test_l3_native_release_validation.py"
      - ".github/workflows/mooncake-l3-test.yml"
  workflow_dispatch:
    inputs:
      iterations:
        description: >-
          Native master suite repetitions (1-20). Repeated protocol
          validation, not a long-duration serving soak.
        required: true
        default: "3"
      iteration-timeout-seconds:
        description: >-
          Per-iteration timeout in seconds (10-3600). iterations x timeout
          plus cleanup and the setup margin must fit this job's 180-minute dispatch
          budget.
        required: true
        default: "900"

# Dispatched repetition runs get their own group: a push or pull request
# must never cancel an in-flight dispatch (and lose its evidence).
concurrency:
  group: mooncake-l3-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # Pull requests validate one iteration inside 30 minutes; dispatched
    # repetition runs get a bounded 180-minute budget.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 180 || 30 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # The tokenspeed-mooncake the runtime requires ships the store's C ABI
      # (libmooncake_store.so) and mooncake_master.
      - name: Install Mooncake master runtime
        run: |
          mooncake=$(python -c 'import tomllib; print(next(r for r in tomllib.load(open("python/pyproject.toml", "rb"))["project"]["dependencies"] if r.startswith("tokenspeed-mooncake")))')
          python -m pip install --retries 10 --timeout 60 \
            "$mooncake" 'nvidia-cuda-runtime==13.0.96' 'pytest>=9'
          # The wheel links CUDA 13 and libcuda even for Host-only TCP tests.
          # Install user-space driver libraries; no GPU or kernel driver is used.
          if ! sudo apt-get install -y --no-install-recommends \
            libcurl4 libibverbs1 librdmacm1 libnuma1 liburing2 rdma-core \
            libnvidia-compute-580-server; then
            sudo apt-get update -o Acquire::Retries=5
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
              libcurl4 libibverbs1 librdmacm1 libnuma1 liburing2 rdma-core \
              libnvidia-compute-580-server
          fi
          echo "TS_MOONCAKE_STORE_LIBRARY=$(python -c 'import mooncake, os; print(os.path.join(os.path.dirname(mooncake.__file__), "libmooncake_store.so"))')" >> "$GITHUB_ENV"

      - name: Install CPU scheduler roundtrip dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e 'tokenspeed-scheduler[test]'

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # The executor against a live master: round trips, objects outliving
      # their writer, KVP owner relocation, tenant isolation, master restart.
      # The release validation runner repeats that suite in isolated,
      # timed-out subprocesses with MOONCAKE_REQUIRE_MASTER=1 strictly set,
      # keeps raw output plus per-iteration receipts, and fails closed on
      # zero-test, skipped, misscoped or incomplete runs. Pull requests run
      # one iteration; workflow_dispatch takes bounded repetition. Repetition
      # is repeated protocol validation, not a long-duration serving soak.
      # exec puts the runner in the step's shell PID so job cancellation and
      # timeout signals reach it and it can still write its report; the
      # wall-clock budget rejects repetitions that cannot fit the job's
      # timeout including cleanup and the runner's setup margin.
      - name: Run the L3 executor's live master tests
        env:
          VALIDATION_ITERATIONS: ${{ inputs.iterations || '1' }}
          VALIDATION_ITERATION_TIMEOUT: ${{ inputs['iteration-timeout-seconds'] || '900' }}
          # Seconds matching this job's timeout-minutes (180 dispatch / 30).
          VALIDATION_WALL_CLOCK_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '10800' || '1800' }}
          # A cross-check label only; the tested commit (the merge commit on
          # pull requests) is recorded from the checkout itself.
          VALIDATION_SOURCE_LABEL: ${{ github.event_name == 'pull_request' && format('pull_request-{0}-head-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('{0}-{1}', github.event_name, github.sha) }}
        run: |
          exec python test/ci_system/l3_native_release_validation.py \
            --iterations "$VALIDATION_ITERATIONS" \
            --iteration-timeout "$VALIDATION_ITERATION_TIMEOUT" \
            --terminate-timeout 20 \
            --wall-clock-budget "$VALIDATION_WALL_CLOCK_BUDGET" \
            --engine-dir tokenspeed-engine \
            --output-dir "$RUNNER_TEMP/l3-native-validation" \
            --source-revision "$VALIDATION_SOURCE_LABEL"

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-native-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/l3-native-validation
          if-no-files-found: warn
          retention-days: 30

      # tokenspeed_engine.L3Executor without ts-host, which needs no C++
      # scheduler build.
      - name: Build the L3 executor's Python module
        working-directory: tokenspeed-engine
        run: |
          PYO3_BUILD_EXTENSION_MODULE=1 cargo build --release --locked -p tokenspeed-py
          cp target/release/lib_native.so \
            "python/tokenspeed_engine/_native$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"

      - name: Run L3 unit tests and live master roundtrip
        env:
          MOONCAKE_REQUIRE_MASTER: "1"
          PYTHONPATH: python:tokenspeed-engine/python
        run: |
          python -m pytest \
            test/test_l3_kvstore.py \
            test/test_l3_tail_roundtrip.py -v -s --log-cli-level=INFO

  async-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install CPU protocol test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install psutil prometheus-client -e 'tokenspeed-scheduler[test]'

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the L3 executor's Python module
        working-directory: tokenspeed-engine
        run: |
          PYO3_PYTHON=$(which python) PYO3_BUILD_EXTENSION_MODULE=1 \
            cargo build --release --locked -p tokenspeed-py
          cp target/release/lib_native.so \
            "python/tokenspeed_engine/_native$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"

      # The release validation runner's own tests are CPU-only: real small
      # subprocesses and temporary files, no Mooncake master or GPU.
      - name: Run release validation runner tests
        run: |
          python -m pytest -q \
            test/ci_system/test_l3_native_release_validation.py

      # The executor's own tests, the replica agreement and the L3 metrics
      # run in the engine's Rust tests (tokenspeed-engine-test.yml); without
      # Mooncake the native tail round trips skip.
      - name: Run asynchronous storage tests
        env:
          PYTHONPATH: python:tokenspeed-engine/python
        run: |
          python -m pytest -q \
            test/test_host_cache_storage.py \
            test/test_l3_tail_roundtrip.py
