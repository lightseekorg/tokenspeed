name: PR Source Policy

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  pr-source-policy:
    name: PR source policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only inspect PR metadata; never check out or execute PR code.
      - name: Check PR source
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const pr = context.payload.pull_request;
              if (!pr.head.repo || pr.head.repo.id === pr.base.repo.id) {
                return;
              }

              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: pr.user.login,
              });
              if (data.permission !== 'write' && data.permission !== 'admin') {
                return;
              }

              const message = 'Please push your branch to the main repository and open a new pull request from that branch.';
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: message,
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pr.number,
                state: 'closed',
              });
              core.setFailed(message);
            } catch {
              core.setFailed('Unable to complete the PR source check. Please retry.');
            }
