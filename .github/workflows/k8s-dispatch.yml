name: K8s Dispatch

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional pull request number or URL; blank runs latest main"
        required: false
        default: ""
        type: string
      yaml:
        description: "CI YAML to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - test/ci/eval/deepseek-v4-flash-evalscope-gsm8k.yaml
          - test/ci/eval/deepseek-v4-flash-mtp-evalscope-gsm8k-amd.yaml
          - test/ci/eval/deepseek-v4-flash-mtp-evalscope-gsm8k.yaml
          - test/ci/eval/deepseek-v4-pro-mtp-evalscope-gsm8k-amd.yaml
          - test/ci/eval/glm-5.2-nvfp4-mtp-evalscope-aime26.yaml
          - test/ci/eval/gpt-oss-120b-mxfp4-evalscope-gpqa-diamond.yaml
          - test/ci/eval/inkling-nvfp4-mtp-evalscope-aime25.yaml
          - test/ci/eval/inkling-mxfp4-mtp-evalscope-aime25.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-dflash-evalscope-aime25.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-aime25.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-gpqa-diamond.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-gsm8k.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-mmlu.yaml
          - test/ci/eval/kimi-k2.5-nvfp4-eagle3-evalscope-ocr-bench.yaml
          - test/ci/eval/kimi-k2.5-mxfp4-eagle3-evalscope-aime25-amd.yaml
          - test/ci/eval/kimi-k3-dspark-mxfp4-tp8ep8-evalscope-aime26-amd.yaml
          - test/ci/eval/kimi-k3-mxfp4-tp8ep8-evalscope-aime26-amd.yaml
          - test/ci/eval/minimax-m3-nvfp4-dspark-evalscope-aime26.yaml
          - test/ci/eval/minimax-m3-nvfp4-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-122b-a10b-nvfp4-epd-1e1p2d-evalscope-ocr-bench.yaml
          - test/ci/eval/qwen3.5-122b-a10b-nvfp4-evalscope-ocr-bench.yaml
          - test/ci/eval/qwen3.5-35b-a3b-fp8-deepep-tp2dp2ep4-evalscope-gsm8k.yaml
          - test/ci/eval/qwen3.5-397b-a17b-nvfp4-dp4ep4-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-397b-a17b-nvfp4-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-397b-a17b-nvfp4-pd-1p1d-evalscope-aime25.yaml
          - test/ci/eval/qwen3.5-397b-a17b-mxfp4-evalscope-aime25.yaml
          - test/ci/perf/gpt-oss-120b-mxfp4-evalscope-mi35x.yaml
          - test/ci/perf/kimi-k2.5-nvfp4-evalscope-agentic.yaml
          - test/ci/perf/kimi-k3-dspark-mxfp4-tp8ep8-evalscope-random-4k-1k-mi35x.yaml
          - test/ci/perf/kimi-k3-mxfp4-tp8ep8-evalscope-random-4k-1k-mi35x.yaml
          - test/ci/perf/qwen3.5-397b-a17b-nvfp4-evalscope-agentic-b200-8gpu.yaml
          - test/ci/perf/qwen3.5-397b-a17b-nvfp4-evalscope-agentic.yaml
          - test/ci/perf/qwen3.5-397b-a17b-nvfp4-evalscope-longctx.yaml
          - test/ci/ut/qwen3.5-122b-a10b-nvfp4-epd-1e1p2d.yaml
          - test/ci/ut/qwen3.5-397b-a17b-nvfp4-pd-1p1d.yaml
          - test/ci/ut/ut-runtime-1gpu.yaml
          - test/ci/ut/ut-runtime-2gpu.yaml
          - test/ci/ut/ut-runtime-prefix-cache-e2e.yaml
          - test/ci/ut/ut-tokenspeed-kernel.yaml
      runner_pool:
        description: "Runner pool selected from the YAML labels"
        required: true
        default: "b200v2"
        type: choice
        options:
          - b200v2
          - amd
          - gb200
          - b300
          - all
      task_types:
        description: "Comma-separated task types"
        required: true
        default: "eval,perf"
        type: string
      match:
        description: "Optional comma-separated task/model substrings"
        required: false
        default: ""
        type: string
      include_mmlu:
        description: "Include long-running MMLU tasks"
        required: true
        default: false
        type: boolean
      trigger:
        description: "Optional task trigger filter"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - manual
          - nightly
          - debug
          - per-commit

concurrency:
  group: k8s-dispatch-${{ inputs.pr || 'main' }}-${{ inputs.yaml }}-${{ inputs.runner_pool }}-${{ inputs.match }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_tasks: ${{ steps.matrix.outputs.has_tasks }}
      source_sha: ${{ steps.source.outputs.sha }}
      install_tokenspeed_mla_from_source: ${{ steps.source.outputs.install_mla }}
    steps:
      - name: Resolve source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            link="https://github.com/${{ github.repository }}/commit/$sha"
            install_mla=0
          else
            number=${PR##*/}
            [[ "$number" =~ ^[0-9]+$ ]] || {
              echo "Invalid pull request: $PR" >&2
              exit 2
            }
            data=$(gh api "repos/${{ github.repository }}/pulls/$number")
            sha=$(jq -r .head.sha <<< "$data")
            link=$(jq -r .html_url <<< "$data")
            if gh api "repos/${{ github.repository }}/pulls/$number/files" \
              --paginate --jq '.[].filename' | grep -q '^tokenspeed-mla/'; then
              install_mla=1
            else
              install_mla=0
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "install_mla=$install_mla" >> "$GITHUB_OUTPUT"
          {
            echo "### K8s Dispatch"
            echo
            echo "- Source: [$link]($link)"
            echo "- Commit: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Install scan dependency
        run: python3 -m pip install pyyaml

      - name: Build task matrix
        id: matrix
        env:
          YAML_SELECTION: ${{ inputs.yaml }}
          RUNNER_POOL: ${{ inputs.runner_pool }}
          TASK_TYPES: ${{ inputs.task_types }}
          MATCH: ${{ inputs.match }}
          INCLUDE_MMLU: ${{ inputs.include_mmlu }}
          TRIGGER: ${{ inputs.trigger }}
          TOKENSPEED_B200_RUNNER_LABEL: b200v2
          TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS: h100,gb300
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          repo = Path.cwd()
          sys.path.insert(0, str(repo / "test/ci_system"))
          from pipeline import build_matrix

          def terms(name):
              return [item.strip() for item in os.environ[name].split(",") if item.strip()]

          selected_yaml = terms("YAML_SELECTION")
          selected_types = set(terms("TASK_TYPES"))
          matches = [item.lower() for item in terms("MATCH")]
          trigger = os.environ["TRIGGER"]
          matrix = build_matrix(
              repo / "test/ci",
              repo,
              None if trigger == "all" else trigger,
              runner_group="all",
          )

          if selected_yaml != ["all"]:
              invalid = [
                  item for item in selected_yaml
                  if not item.startswith("test/ci/") or not (repo / item).is_file()
              ]
              if invalid:
                  raise SystemExit(f"Invalid CI YAML: {', '.join(invalid)}")
              selected_paths = set(selected_yaml)
          else:
              selected_paths = None

          include = []
          for task in matrix["include"]:
              searchable = f"{task['name']} {task['config']}".lower()
              runner = task["runner"]
              if runner.startswith("slurm-"):
                  continue
              pool = os.environ["RUNNER_POOL"]
              runner_families = {
                  "b200v2": runner.startswith("b200v2-"),
                  "amd": runner.startswith("amd-"),
                  "gb200": runner.startswith("gb200-"),
                  "b300": runner.startswith("b300-"),
              }
              if pool != "all" and not runner_families[pool]:
                  continue
              if selected_paths is not None and task["config"] not in selected_paths:
                  continue
              if task["type"] not in selected_types:
                  continue
              if matches and not any(term in searchable for term in matches):
                  continue
              if os.environ["INCLUDE_MMLU"] != "true" and "mmlu" in searchable:
                  continue
              include.append(task)

          result = {"include": include}
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"matrix={json.dumps(result, separators=(',', ':'))}\n")
              stream.write(f"has_tasks={'true' if include else 'false'}\n")
          if not include:
              raise SystemExit("No CI tasks matched the requested filters")
          print(json.dumps(result, indent=2))
          PY

  run:
    needs: scan
    if: needs.scan.outputs.has_tasks == 'true'
    uses: ./.github/workflows/run-pr-test-stage.yml
    with:
      matrix: ${{ needs.scan.outputs.matrix }}
      install_tokenspeed_mla_from_source: ${{ needs.scan.outputs.install_tokenspeed_mla_from_source }}
      b200_runner_label: b200v2
      checkout_ref: ${{ needs.scan.outputs.source_sha }}
      timeout_minutes: 720
    secrets: inherit
