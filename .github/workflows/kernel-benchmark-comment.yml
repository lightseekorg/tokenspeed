name: AMD Kernel Benchmark PR Comment

on:
  workflow_run:
    workflows: ["AMD Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: amd-kernel-benchmark-comment-${{ github.event.workflow_run.head_repository.id || github.event.workflow_run.id }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.head_sha }}
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish benchmark report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -- \
            --repository "$EXPECTED_REPOSITORY" \
            --run-id "$EXPECTED_RUN_ID" \
            --run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --head-sha "$EXPECTED_HEAD_SHA" \
            --head-repository "$EXPECTED_HEAD_REPOSITORY" \
            --head-branch "$EXPECTED_HEAD_BRANCH" \
            --base-branch "$EXPECTED_BASE_BRANCH"
          if [ -n "$EXPECTED_PULL_REQUEST" ]; then
            set -- "$@" --pull-request-number "$EXPECTED_PULL_REQUEST"
          fi
          python3 test/ci_system/kernel_benchmark_comment.py "$@"
