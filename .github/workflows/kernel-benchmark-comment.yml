name: AMD Kernel Benchmark PR Comment

on:
  workflow_run:
    workflows: ["PR Test AMD"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: amd-kernel-benchmark-comment-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish benchmark report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python3 test/ci_system/kernel_benchmark_comment.py \
            --repository "$EXPECTED_REPOSITORY" \
            --run-id "$EXPECTED_RUN_ID" \
            --run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --pull-request-number "$EXPECTED_PULL_REQUEST"
