name: Update tokenspeed-smg version

on:
  workflow_dispatch:
    inputs:
      smg_version:
        description: "tokenspeed-smg version pin, for example 1.4.1.post20260519."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.smg_version }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure git author
        run: |
          git config user.name "lightseek-bot"
          git config user.email "243258330+lightseek-bot@users.noreply.github.com"

      - name: Update the tokenspeed-smg pin
        id: update
        env:
          SMG_VERSION: ${{ inputs.smg_version }}
        run: |
          set -euo pipefail

          pep440='^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?(\+[A-Za-z0-9.]+)?$'
          if ! [[ "$SMG_VERSION" =~ $pep440 ]]; then
            echo "Invalid tokenspeed-smg version: $SMG_VERSION" >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["SMG_VERSION"]
          path = Path("python/pyproject.toml")
          text = path.read_text()
          pattern = r'(?m)^(?P<lead>\s*")tokenspeed-smg==[^"]+(?P<tail>",?)\s*$'
          text, count = re.subn(pattern, lambda m: f'{m["lead"]}tokenspeed-smg=={version}{m["tail"]}', text, count=1)
          if count != 1:
              raise SystemExit("pin for tokenspeed-smg not found in python/pyproject.toml")
          path.write_text(text)
          PY

          echo "smg_version=${SMG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.LIGHTSEEK_BOT_TOKEN }}
          SMG_VERSION: ${{ steps.update.outputs.smg_version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "LIGHTSEEK_BOT_TOKEN is required because this repository does not allow GITHUB_TOKEN to create pull requests." >&2
            exit 1
          fi

          if git diff --quiet; then
            echo "The tokenspeed-smg pin already matches the requested version."
            exit 0
          fi

          branch="bot/update-tokenspeed-smg-${SMG_VERSION//+/-}"
          git checkout -b "$branch"
          git add python/pyproject.toml
          git commit -s -m "Update the tokenspeed-smg pin to ${SMG_VERSION}"
          git push --force origin "HEAD:refs/heads/${branch}"

          cat > pr-body.md <<EOF
          ## Summary
          - update \`tokenspeed-smg\` to ${SMG_VERSION}

          ## Tests
          - Not run (version-only workflow update)
          EOF

          title="Update the tokenspeed-smg pin to ${SMG_VERSION}"
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file pr-body.md
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body-file pr-body.md
          fi
