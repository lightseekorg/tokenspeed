<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Fuse the first collective, keep the rest of the tail unchanged</title><desc id="desc">Baseline finalize, first AllReduce, RMSNorm become an opt-in BT or HT pipeline. Up-projection, shared and residual arithmetic, second AllReduce and clone are unchanged. Native H3584 uses 56 of 64 reduction lanes.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18283b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#536477}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.muted{fill:#536477}.white{fill:white}.green{fill:#087f71}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718397"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<text x="38" y="50" class="title">One targeted change in the prefill tail</text>
<text x="38" y="80" class="sub">TP8 / EP1 · BF16 routed width 3584 · top-k 16 · opt-in, captured prefill only</text>
<rect x="38" y="108" width="1124" height="295" rx="14" fill="#f3f6fa"/>
<text x="60" y="140" class="label">Expert GEMMs produce routed values, routing weights and row indices</text>
<text x="60" y="188" class="small muted">BEFORE</text>
<rect x="180" y="160" width="260" height="68" rx="10" fill="#fff" stroke="#bbc8d6"/><text x="310" y="186" text-anchor="middle" class="label">Local finalize</text><text x="310" y="209" text-anchor="middle" class="small muted">top-k sum → BF16</text>
<path d="M447 194L491 194" fill="none" stroke="#718397" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502" y="160" width="260" height="68" rx="10" fill="#fff" stroke="#bbc8d6"/><text x="632" y="186" text-anchor="middle" class="label">AllReduce #1</text><text x="632" y="209" text-anchor="middle" class="small muted">staged multimem</text>
<path d="M769 194L813 194" fill="none" stroke="#718397" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="824" y="160" width="312" height="68" rx="10" fill="#fff" stroke="#bbc8d6"/><text x="980" y="186" text-anchor="middle" class="label">RMSNorm</text><text x="980" y="209" text-anchor="middle" class="small muted">normalized routed values</text>
<text x="60" y="294" class="small green">AFTER</text><rect x="180" y="255" width="956" height="76" rx="10" fill="#ddf5ef" stroke="#47a596"/><text x="658" y="281" text-anchor="middle" class="label">Finalize + AllReduce #1 + RMSNorm</text><text x="658" y="304" text-anchor="middle" class="small muted">BT: linked stages with PDL     |     HT: persistent, warp-specialized pipeline</text>
<text x="182" y="362" class="body">Preserves BF16 communication boundaries · native H3584, no H4096 padding</text>
<text x="182" y="387" class="small muted">Shared partial is staged before this collective block in both paths (not shown).</text>
<path d="M632 404L632 437" fill="none" stroke="#718397" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="442" width="1124" height="99" rx="14" fill="#f3f6fa" stroke="#bbc8d6"/>
<text x="60" y="471" class="small muted">UNCHANGED IN BOTH PATHS</text>
<text x="60" y="507" class="label">Shared/prefix add + sharded up-projection (addmm)</text>
<text x="827" y="507" class="label">AllReduce #2 → clone</text><path d="M787 501L814 501" fill="none" stroke="#718397" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="564" width="1124" height="164" rx="14" fill="#fff" stroke="#bbc8d6"/>
<text x="60" y="595" class="label">The small native-width change that removes the padding workaround</text>
<text x="60" y="625" class="body">3584 BF16 / 8 = 448 vectors per row; TP8 owns 56 vectors per reduction shard.</text>
<rect x="60" y="648" width="472" height="38" rx="6" fill="#ddf5ef"/>
<rect x="540" y="648" width="354" height="38" rx="6" fill="#ddf5ef"/>
<rect x="902" y="648" width="118" height="38" rx="6" fill="#f9e7d1"/>
<text x="296" y="673" text-anchor="middle" class="body">Warp 0: 32 valid lanes</text>
<text x="717" y="673" text-anchor="middle" class="body">Warp 1: 24 valid lanes</text>
<text x="961" y="673" text-anchor="middle" class="small">8 masked</text>
<text x="60" y="711" class="small muted">Masked lanes issue no multimem load, optional residual load, or store. Synchronization protocol stays intact.</text>
<text x="38" y="753" class="small muted">Scope: first-stage fusion only. No shared RS, fused up-projection/AG, or serving TTFT claim.</text></svg>
