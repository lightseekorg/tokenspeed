<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" role="img"><title>Fused shared-RS + up-projection + AG: dataflow and synchronization</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607087"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#162d46" font-weight="700">Fused shared-RS + up-projection + AG</text><text x="36" y="81" font-size="17" fill="#607087" font-weight="400">Experimental back half · GB300 TP8 · M4096 / M8192 · not model runtime dispatch</text><text x="36" y="128" font-size="17" fill="#607087" font-weight="700">MATERIALIZED-RS CONTROL</text><rect x="36" y="150" width="230" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="53" y="180" font-size="17" fill="#1b2d43" font-weight="400">Shared symmetric input</text><text x="53" y="204" font-size="17" fill="#1b2d43" font-weight="400">BF16 [M,7168]</text><text x="53" y="228" font-size="17" fill="#1b2d43" font-weight="400">one partial / rank</text><path d="M266,200 L305,200" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><rect x="305" y="150" width="235" height="100" rx="12" fill="#fff0d8" stroke="#cbd5e1"/><text x="322" y="180" font-size="17" fill="#1b2d43" font-weight="400">Standalone shared RS</text><text x="322" y="204" font-size="17" fill="#1b2d43" font-weight="400">global [M,896] shard</text><text x="322" y="228" font-size="17" fill="#1b2d43" font-weight="400">write + later read</text><path d="M540,200 L580,200" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><rect x="580" y="150" width="358" height="100" rx="12" fill="#edf3ff" stroke="#cbd5e1"/><text x="597" y="180" font-size="17" fill="#1b2d43" font-weight="400">Persistent up GEMM + addends</text><text x="597" y="204" font-size="17" fill="#1b2d43" font-weight="400">shared slice → BF16 → residual</text><text x="597" y="228" font-size="17" fill="#1b2d43" font-weight="400">TMA multicast into final output</text><path d="M938,200 L976,200" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><rect x="976" y="150" width="230" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="993" y="180" font-size="17" fill="#1b2d43" font-weight="400">Replicated output</text><text x="993" y="204" font-size="17" fill="#1b2d43" font-weight="400">BF16 [M,7168]</text><text x="993" y="228" font-size="17" fill="#1b2d43" font-weight="400">completion fence</text><text x="36" y="294" font-size="17" fill="#008574" font-weight="700">FUSED PATH</text><rect x="36" y="317" width="230" height="130" rx="12" fill="#e5f6f1" stroke="#cbd5e1"/><text x="53" y="347" font-size="17" fill="#1b2d43" font-weight="400">Shared symmetric input</text><text x="53" y="371" font-size="17" fill="#1b2d43" font-weight="400">BF16 [M,7168]</text><text x="53" y="395" font-size="17" fill="#1b2d43" font-weight="400">copy OR down-proj out=</text><text x="53" y="419" font-size="17" fill="#1b2d43" font-weight="400">raw publication retained</text><path d="M266,382 L305,382" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><rect x="305" y="317" width="633" height="216" rx="14" fill="#f0faf7" stroke="#008574" stroke-width="2"/><text x="325" y="348" font-size="20" fill="#007b6c" font-weight="700">One persistent RS / up-projection / AG producer</text><rect x="325" y="369" width="270" height="76" rx="12" fill="#d9f0e8" stroke="#cbd5e1"/><text x="342" y="399" font-size="17" fill="#1b2d43" font-weight="400">4 independent load-reduces</text><text x="342" y="423" font-size="17" fill="#1b2d43" font-weight="400">FP32 reduce → BF16 shared</text><rect x="622" y="369" width="294" height="76" rx="12" fill="#dfebfc" stroke="#cbd5e1"/><text x="639" y="399" font-size="17" fill="#1b2d43" font-weight="400">Two-CTA MMA · double TMEM</text><text x="639" y="423" font-size="17" fill="#1b2d43" font-weight="400">latent [M,3584] × local weight</text><path d="M460,445 L460,466" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><path d="M770,445 L770,466" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><rect x="325" y="466" width="591" height="50" rx="12" fill="#e3f1ec" stroke="#cbd5e1"/><text x="342" y="496" font-size="17" fill="#1b2d43" font-weight="400">SMEM addends → two BF16 roundings → TMA multicast</text><path d="M938,425 L976,425" fill="none" stroke="#607087" stroke-width="2.2" marker-end="url(#a)"/><rect x="976" y="369" width="230" height="114" rx="12" fill="#e5f6f1" stroke="#cbd5e1"/><text x="993" y="399" font-size="17" fill="#1b2d43" font-weight="400">Final symmetric output</text><text x="993" y="423" font-size="17" fill="#1b2d43" font-weight="400">BF16 [M,7168]</text><text x="993" y="447" font-size="17" fill="#1b2d43" font-weight="400">no mailbox / AG pass</text><text x="993" y="471" font-size="17" fill="#1b2d43" font-weight="400">completion retained</text><text x="36" y="572" font-size="17" fill="#1b2d43" font-weight="400">Removed: standalone RS launch and global shard traffic. Residual is injected once, after reduction.</text><text x="36" y="602" font-size="17" fill="#1b2d43" font-weight="400">Overlap mechanism: grouped RS requests + early accumulator release + three-stage output ring.</text><text x="36" y="632" font-size="16" fill="#607087" font-weight="400">No claim that MMA is stall-free; retained shard allocation supplies metadata only.</text><rect x="36" y="657" width="1170" height="79" rx="12" fill="#f1f5f9"/><text x="52" y="687" font-size="17" fill="#1b2d43" font-weight="700">Same stream: stage / producer → HT → raw publication → fused producer → output completion</text><text x="52" y="717" font-size="16" fill="#607087" font-weight="400">Full-tail comparison also changes HT stages 7 → 10. M4096: 38 clusters; M8192: queried capacity.</text></g></svg>
