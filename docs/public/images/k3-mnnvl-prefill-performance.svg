<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Tail latency improves; serving qualification remains separate</title><desc id="desc">Historical rank-MAX graph p50 latency in microseconds. Complete tail gains 1.1911x at M4096 and 1.2011x at M8192. Expert plus tail gains 1.0840x and 1.0138x. These are not serving TTFT gains.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18283b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#536477}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.muted{fill:#536477}.white{fill:white}.green{fill:#087f71}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718397"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<text x="38" y="50" class="title">Same optimization. Different measurement boundaries.</text>
<text x="38" y="80" class="sub">8 × GB300 · TP8 / EP1 · rank-MAX CUDA Graph p50 · lower latency is better</text>
<rect x="38" y="103" width="16" height="16" fill="#91a3b8"/><text x="63" y="117" class="small">Baseline</text>
<rect x="171" y="103" width="16" height="16" fill="#109787"/><text x="196" y="117" class="small">BT/HT candidate</text>
<text x="1162" y="117" text-anchor="end" class="small muted">Historical qualification · 15 paired alternating rounds</text><rect x="38" y="142" width="544" height="411" rx="14" fill="#f3f6fa"/>
 <text x="58" y="181" class="label">Complete tail</text>
 <text x="58" y="208" class="small muted">Expert GEMMs excluded · four layer slots</text>
 <text x="58" y="233" class="small muted">Shared-expert GEMMs excluded in both panels</text><text x="58" y="280" class="label">M4096</text><text x="556" y="280" text-anchor="end" class="label green">1.1911×</text><rect x="58" y="293" width="177.31" height="27" rx="4" fill="#91a3b8"/><text x="243.31" y="313" class="body">412.35 µs</text><rect x="58" y="330" width="148.87" height="27" rx="4" fill="#109787"/><text x="214.87" y="350" class="body">346.21 µs</text><text x="58" y="410" class="label">M8192</text><text x="556" y="410" text-anchor="end" class="label green">1.2011×</text><rect x="58" y="423" width="337.83" height="27" rx="4" fill="#91a3b8"/><text x="403.83" y="443" class="body">785.64 µs</text><rect x="58" y="460" width="281.27" height="27" rx="4" fill="#109787"/><text x="347.27" y="480" class="body">654.11 µs</text><text x="58" y="534" class="small muted">Independent panel scales; exact values printed beside bars.</text><rect x="618" y="142" width="544" height="411" rx="14" fill="#f3f6fa"/>
