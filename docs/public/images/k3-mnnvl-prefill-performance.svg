<text x="60" y="609" class="label">This figure does not establish stable large-M serving TTFT gains.</text>
<text x="60" y="641" class="body">Serving sweep: live M512 / M2048; TTFT is mixed (1.0166× geometric mean).</text>
<text x="60" y="669" class="body">Concurrency 1 and 8 regress. No M4096/8192 HT serving qualification is available.</text>
<text x="60" y="697" class="small muted">Keep the route opt-in. See the guide for p90, both serving run orders, correctness gates and reproduction.</text>
<text x="38" y="753" class="small muted">Source: accompanying public summary JSON. Speedup = baseline latency / candidate latency.</text></svg>
