<title id="title">Integrated K3 TP8 MoE tail: unchanged main and fused serving path</title>
<desc id="desc">For token counts above 32 through 8192, both BT or HT first-stage fusion and shared ReduceScatter, up-projection, residual and AllGather fusion are connected to serving. Shared down-projection writes directly to symmetric input. Independent MMA and grouped reduction feed an epilogue that releases accumulators before output-stage reuse and multicasts into the final output. Small and above-range paths are preserved. This is a structural diagram, not a latency chart.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker>
  <style>
    text { font-family: Arial, sans-serif; fill: #18324d; }
    .title { font-size: 30px; font-weight: 700; }
    .sub { font-size: 18px; fill: #60758d; }
    .heading { font-size: 21px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 16px; fill: #526981; }
    .label { font-size: 18px; font-weight: 700; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
  </style>
</defs>
