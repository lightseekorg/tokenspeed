# Conditional endpoint reference for the documented eight-GPU H200 SXM board.
# Eighteen full-rate links × 25 GB/s per direction. The raw 26.562 GB/s
# driver observation checks the active-link state.
communication_capacities:
  - &trtllm_ipc_oneshot
    id: "nvlink4-eighteen-link-trtllm-ipc-oneshot"
    bytes_per_second: 450000000000
    bidirectional_bytes_per_second: 900000000000
    scope: "per_rank"
    direction: "one_direction"
    normalization: "nccl_tests_bus_bytes"
    placement: "single_node"
    topology: "single_node_nvswitch"
    transport: "nvlink"
    backend: "trtllm"
    algorithm: "oneshot"
    protocol: "lamport"
    world_size: 8
    source_id: "nvidia-hopper-nvlink4"
    conversion_source_id: "nvidia-hopper-nvlink4"
    normalization_source_id: "nvidia-nccl-tests"
    published_value: 25
    published_unit: "GB/s"
    published_direction: "one_direction"
    published_scope: "per_link"
    conversion_factor: 1
    active_link_count: 18
    link_generation: "4.0"
    nvlink_board:
      pci_device_id: 0x233510de
      pci_subsystem_id: 0x18be10de
      switch_count: 4
      pci_source_id: "nvidia-supported-gpus"
      generation_source_id: "nvidia-hgx-h200-topology"
      switch_source_id: "nvidia-hgx-h200-fabric-manager"
    required_link_rate_bytes_per_second: 26562000000
    conversion_reason: "NVIDIA specifies NVLink 4 at 25 GB/s per link per direction. The observed H200 PCI identities, full GPUs, common four NVSwitch endpoints, NV18 peer matrix and 18 full-rate links per rank establish the documented board configuration. The reference is 450 GB/s per direction per rank and 900 GB/s for the symmetric bidirectional sum."
    normalization_reason: "NCCL-tests equivalent AllReduce bytes divided by the whole fused or pure Op GPU span, referenced to one endpoint's one-direction theoretical NVLink capacity. Lamport one/two-shot remote loads do not transfer exactly these equivalent bytes; this ratio is an estimated normalized reference efficiency, not physical link saturation or protocol payload utilization. Actual selected NVLink transport and the exact IPC route must be evidenced."
  - <<: *trtllm_ipc_oneshot
    id: "nvlink4-eighteen-link-trtllm-ipc-twoshot"
    algorithm: "twoshot"
  - <<: *trtllm_ipc_oneshot
    id: "nvlink4-eighteen-link-trtllm-mnnvl-oneshot"
    algorithm: "oneshot"
    protocol: "mnnvl"
    normalization: "trtllm_mnnvl_oneshot_remote_payload"
    normalization_source_id: "nvidia-cuda-multicast"
    addressing_source_id: "nvidia-cuda-multicast"
    normalization_reason: "Custom MNNVL one-shot useful remote-payload model: for full input S bytes and P ranks, each rank injects S bytes once to the CUDA NVLS multicast mapping and receives (P-1)*S useful payload bytes from other ranks at its local replica. Divide each directional payload by the whole pure/fused Op GPU span and its450GB/s directional reference; report the larger modeled ratio, not the sum of TX and RX. NCCL-tests AlgBW/BusBW remain independent. Self-replica physical loopback, packet/encoding/retry/control overhead are unmodeled; local Lamport polling, dirty-clear, register reduction and epilogue are not remote payload. This is estimated directional useful-payload utilization, not physical TX/RX occupancy, switch bisection or measured saturation. Require actual CUDA allocator/mapping evidence, selected one-shot pattern0/1, exact single-node NVSwitch rank placement and full active-link predicates. Multi-node and unverified mappings remain unavailable."
