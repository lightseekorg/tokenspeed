source: "NVIDIA H200 GPU official product specifications; live product page, H200 SXM column; preliminary specifications; accessed 2026-11-09. SXM 141GB, one full GPU, not a multi-GPU NVLink pair or MIG slice. Dense Tensor Core peak is half the sparse published rate; FP32 SIMT and HBM bandwidth are unchanged. Decimal units. power_watts is the nominal maximum configurable TDP, not an observed power limit. Selection is explicit; device names alone do not prove form factor or TDP. H200 compute capability9.0 is listed by NVIDIA CUDA GPU Compute Capability. BF16 SIMT134TFLOP/s is derived from the reviewed CC9.0 scalar FMA-reference throughput ratio2 and the FP32 product peak, not a published BF16 SIMT product specification. Conditional450GB/s communication references require every participating rank to prove eighteen full-rate NVLink4 links, exact single-node NVSwitch placement and the selected reviewed route; missing evidence remains unavailable."
