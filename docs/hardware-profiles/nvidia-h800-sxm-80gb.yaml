# Conditional endpoint reference, never selected from the GPU name or NV8 alone.
# NVML enum6 means NVLink4.0. Eight proven active full-rate links *25GB/s TX.
# Raw driver26.562GB/s is a state predicate, not the published directional rate.
communication_capacities:
  - &trtllm_ipc_oneshot
    id: "nvlink4-eight-link-trtllm-ipc-oneshot"
    bytes_per_second: 200000000000
    scope: "per_rank"
    direction: "one_direction"
    normalization: "nccl_tests_bus_bytes"
    placement: "single_node"
    topology: "single_node_nvswitch"
    transport: "nvlink"
    backend: "trtllm"
    algorithm: "oneshot"
    protocol: "lamport"
    world_size: 8
    source_id: "nvidia-hopper-nvlink4"
    conversion_source_id: "nvidia-hopper-nvlink4"
    normalization_source_id: "nvidia-nccl-tests"
    published_value: 25
    published_unit: "GB/s"
    published_direction: "one_direction"
    published_scope: "per_link"
    conversion_factor: 1
    active_link_count: 8
    link_version: 6
    link_generation: "4.0"
    link_version_source_id: "nvidia-nvml-version"
    required_link_rate_bytes_per_second: 26562000000
    conversion_reason: "NVIDIA specifies NVLink4 at25GB/s each direction per link. Multiply by eight only when every participating rank proves eight active NVLink4 links and the required full-rate state. No division of the unspecified H800400GB/s headline and no H10018-link aggregate."
    normalization_reason: "NCCL-tests equivalent AllReduce bytes divided by the whole fused or pure Op GPU span, referenced to one endpoint's one-direction theoretical NVLink capacity. Lamport one/two-shot remote loads do not transfer exactly these equivalent bytes; this ratio is an estimated normalized reference efficiency, not physical link saturation or protocol payload utilization. Actual selected NVLink transport and the exact IPC route must be evidenced."
  - <<: *trtllm_ipc_oneshot
    id: "nvlink4-eight-link-trtllm-ipc-twoshot"
    algorithm: "twoshot"
  - <<: *trtllm_ipc_oneshot
    id: "nvlink4-eight-link-trtllm-mnnvl-oneshot"
    algorithm: "oneshot"
    protocol: "mnnvl"
    normalization: "trtllm_mnnvl_oneshot_remote_payload"
    normalization_source_id: "nvidia-cuda-multicast"
    addressing_source_id: "nvidia-cuda-multicast"
    normalization_reason: "Custom MNNVL one-shot useful remote-payload model: for full input S bytes and P ranks, each rank injects S bytes once to the CUDA NVLS multicast mapping and receives (P-1)*S useful payload bytes from other ranks at its local replica. Divide each directional payload by the whole pure/fused Op GPU span and its200GB/s directional reference; report the larger modeled ratio, not the sum of TX and RX. NCCL-tests AlgBW/BusBW remain independent. Self-replica physical loopback, packet/encoding/retry/control overhead are unmodeled; local Lamport polling, dirty-clear, register reduction and epilogue are not remote payload. This is estimated directional useful-payload utilization, not physical TX/RX occupancy, switch bisection or measured saturation. Require actual CUDA allocator/mapping evidence, selected one-shot pattern0/1, exact single-node NVSwitch rank placement and full active-link predicates. Multi-node and unverified mappings remain unavailable."
