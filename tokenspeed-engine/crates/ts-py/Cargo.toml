[package]
name = "tokenspeed-py"
description = "Python bindings: a ts-client frontend for tests and tools that drive an engine, the L3 executor, the disaggregation bootstrap server and a transfer engine for processes that host memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
# The extension module `tokenspeed_engine._native`; the package around it is
# `python/tokenspeed_engine` (see `tokenspeed-engine/pyproject.toml`).
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
abi3 = ["pyo3/abi3-py312"]

[dependencies]
bytes.workspace = true
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
ts-client = { package = "tokenspeed-client", version = "0.2.0", path = "../ts-client" }
ts-l3 = { package = "tokenspeed-l3", version = "0.1.0", path = "../ts-l3", features = ["python"] }
ts-mooncake = { package = "tokenspeed-mooncake", version = "0.1.0", path = "../ts-mooncake" }
ts-pd = { package = "tokenspeed-pd", version = "0.1.0", path = "../ts-pd" }
ts-wire = { package = "tokenspeed-wire", version = "0.1.0", path = "../ts-wire" }

[dev-dependencies]
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport", "ipc-transport"] }

[lints]
workspace = true
