[package]
name = "tokenspeed-host"
description = "One TokenSpeed engine rank: the Rust control plane, with the data plane in an embedded interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[[bin]]
name = "ts-host"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
pyo3 = "0.30"
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-collective = { package = "tokenspeed-collective", version = "0.1.0", path = "../ts-collective" }
ts-control = { package = "tokenspeed-control", version = "0.1.0", path = "../ts-control" }
ts-grammar = { package = "tokenspeed-grammar", version = "0.1.0", path = "../ts-grammar" }
ts-l3 = { package = "tokenspeed-l3", version = "0.1.0", path = "../ts-l3", features = ["python"] }
ts-metrics = { package = "tokenspeed-metrics", version = "0.1.0", path = "../ts-metrics" }
ts-mooncake = { package = "tokenspeed-mooncake", version = "0.1.0", path = "../ts-mooncake" }
ts-pd = { package = "tokenspeed-pd", version = "0.1.0", path = "../ts-pd" }
ts-scheduler = { package = "tokenspeed-scheduler", version = "0.1.0", path = "../ts-scheduler" }
ts-wire = { package = "tokenspeed-wire", version = "0.1.0", path = "../ts-wire" }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

[lints]
workspace = true
