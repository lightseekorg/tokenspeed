[build-system]
requires = [
    "setuptools>=70",
    "wheel",
    "nanobind>=2.13.0",
    "tokenspeed-spdlog==1.15.1",
    "cmake>=3.22",
    "ninja>=1.11",
]
build-backend = "setuptools.build_meta"

[project]
name = "tokenspeed-engine"
version = "0.2.0"
description = "TokenSpeed engine control plane, scheduler and frontend client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "setproctitle"]
license = "MIT"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["tokenspeed_engine"]
