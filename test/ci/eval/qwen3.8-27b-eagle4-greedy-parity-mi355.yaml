api_version: ci.tokenspeed.io/v1
# Greedy parity of EAGLE-4 speculative decoding with plain decoding, for
# Qwen3.8-27B on one MI355 GPU with the MHA attention backend. The script
# decodes 16 chat prompts (256 tokens, thinking on) with each mode of the smoke
# task (static chain, static tree, EAGLE-Harness), then without speculation,
# and compares each output with the reference up to its first different token.
# A difference passes as a numerical tie when the reference server's logprobs
# of the two tokens differ by at most 0.13, or, recomputed in fp32 with the
# Hugging Face model, when the mode's token is the fp32 argmax or within 2 bf16
# ulps of the reference token. Any other difference fails the task. Results
# land in .ci-artifacts/published/eagle4-parity/parity.json.
name: eval-qwen3.8-27b-eagle4-greedy-parity-mi355
type: eval
workflow_stage: model-test
triggers:
  - post-submit
  - manual
# The modules the target model (qwen3_5*, qwen3_vision) and the EAGLE-4 draft
# model (llama, nemotron_h, through llama_eagle4 and llama_eagle3) import.
# Changes to EAGLE draft modules (shared) and to code outside models/ always
# run this task; only PRs changing nothing but other models' modules skip it.
model_sources:
  - python/tokenspeed/runtime/models/llama.py
  - python/tokenspeed/runtime/models/nemotron_h.py
  - python/tokenspeed/runtime/models/qwen3_5.py
  - python/tokenspeed/runtime/models/qwen3_5_moe.py
  - python/tokenspeed/runtime/models/qwen3_vision.py
runner:
  labels:
    - amd-mi355-1gpu
# Non-blocking until runs on the CI runners confirm it.
optional: true
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps_rocm.sh
eval:
  command: >-
    python3 test/eagle4_serving/eagle4_check.py parity
    --out-dir .ci-artifacts/published/eagle4-parity
report:
  github_step_summary: true
