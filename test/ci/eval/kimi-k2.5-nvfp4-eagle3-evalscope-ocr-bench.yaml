api_version: ci.tokenspeed.io/v1
name: eval-kimi-k2.5-nvfp4-eagle3-ocr-bench
type: eval
workflow_stage: model-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - b200-4gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
server:
  # Temporary NFS cold-load headroom; revert after the startup bottleneck is fixed.
  command: >-
    ts serve
    --disable-kvstore
    --model nvidia/Kimi-K2.5-NVFP4
    --tp 4
    --max-model-len 80000
    --trust-remote-code
    --attention-backend tokenspeed_mla
    --mm-attention-backend fa4
    --moe-backend flashinfer_trtllm
    --quantization nvfp4
    --kv-cache-dtype fp8
    --speculative-algorithm EAGLE3
    --speculative-draft-model-path lightseekorg/kimi-k2.5-eagle3-mla
    --speculative-num-steps 1
    --drafter-attention-backend tokenspeed_mla
    --enable-cache-report
    --engine-startup-timeout 2400
    --host 127.0.0.1
    --port 8000
  ready:
    url: http://127.0.0.1:8000/readiness
    timeout: 1800
    interval: 10
eval:
  install:
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]'
  command: >-
    HF_HOME=${RUNNER_TEMP:-/tmp}/hf-eval-cache
    /tmp/evalscope-perf/bin/evalscope eval
    --model nvidia/Kimi-K2.5-NVFP4
    --api-url http://127.0.0.1:8000/v1
    --api-key EMPTY_TOKEN
    --datasets ocr_bench
    --dataset-hub huggingface
    --dataset-args '{"ocr_bench":{"dataset_id":"echo840/OCRBench"}}'
    --eval-batch-size 16
report:
  github_step_summary: true
score_threshold: 0.9
