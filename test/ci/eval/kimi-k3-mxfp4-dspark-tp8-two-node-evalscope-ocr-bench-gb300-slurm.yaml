api_version: ci.tokenspeed.io/v1
name: eval-kimi-k3-mxfp4-dspark-tp8-two-node-ocr-bench-gb300-slurm
type: eval
workflow_stage: model-test
triggers:
  - slurm
runner:
  labels:
    - slurm-gb300-4gpu
slurm:
  nodes: 2
  gpus_per_node: 4
env:
  CI: "true"
  TOKENSPEED_DFLASH_AUX_STREAM: attn_res
install:
  - bash test/ci_system/install_deps.sh
  - python3 -m pip install flash-linear-attention
server:
  command: >-
    ts serve /models/moonshotai--Kimi-K3/9f62e4e9fffbd0a83ddd60e1c209d828994b3569
    --served-model-name kimi-k3
    --speculative-algorithm DSPARK
    --speculative-draft-model-path /models/Inferact--Kimi-K3-DSpark/cf6b8244620e7ea4b0651d214f28e89eac75bed6
    --speculative-num-draft-tokens 8
    --drafter-attention-backend mla
    --trust-remote-code
    --max-model-len 65536
    --kv-cache-dtype fp8
    --tensor-parallel-size 8
    --mm-encoder-tp-mode data
    --moe-backend flashinfer_trtllm
    --gpu-memory-utilization 0.92
    --max-num-seqs 16
    --disable-prefill-graph
    --disable-kvstore
    --host 0.0.0.0
    --port 8000
  ready:
    url: http://127.0.0.1:8000/readiness
    timeout: 7200
    interval: 10
eval:
  install:
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]'
  command: >-
    HF_HOME=${RUNNER_TEMP:-/tmp}/hf-eval-cache
    /tmp/evalscope-perf/bin/evalscope eval
    --model kimi-k3
    --api-url http://127.0.0.1:8000/v1
    --api-key EMPTY_TOKEN
    --datasets ocr_bench
    --dataset-hub huggingface
    --dataset-args '{"ocr_bench":{"dataset_id":"echo840/OCRBench"}}'
    --eval-batch-size 16
    --stream
    --generation-config '{"do_sample":true,"temperature":1.0,"top_p":0.95,"max_tokens":16384,"extra_body":{"reasoning_effort":"high"}}'
report:
  github_step_summary: true
