api_version: ci.tokenspeed.io/v1
name: ut-mori-ep-2gpu
type: ut
workflow_stage: unit-test
# MORI is AMD-only and builds gfx950 dispatch/combine kernels from source, so this
# job runs on a 2-GPU MI350X runner. Kept `optional` (continue-on-error) and
# manual/per-commit until the ROCm CI image ships MORI + flydsl by default; promote
# to a required per-commit gate once the runner provides them out of the box.
triggers:
  - manual
  - per-commit
optional: true
runner:
  labels:
    - amd-mi35x-2gpu-test
env:
  CI: "true"
  MORI_PER_RANK_VMM: "4294967296"
install:
  - bash test/ci_system/install_deps.sh
  # MORI's .so links libgrpc++.so.1.51 (gRPC 1.51 C++ runtime), absent from the ROCm runner
  # image; without it ``import mori`` fails and the test would skip via mori_available().
  # Install the Ubuntu 24.04 (noble) t64 package so the test actually runs.
  - sudo apt-get install -y libgrpc++1.51t64
  # MORI EP deps from the pre-built PyPI wheel (amd-mori) — no source build, no build-time
  # hipcc/cmake. The wheel ships the compiled libmori_*.so and the v2 dispatch_combine API;
  # flydsl is the runtime JIT dep for the v2 device kernels. Pin flydsl to 0.2.4: amd-mori
  # 1.2.2 needs the pre-0.3.0 flydsl API (0.3.0 renamed flydsl.expr.vector -> Vector, so
  # ``import mori`` fails with the unpinned [flydsl] extra). The test still self-skips via
  # mori_available() if the import fails for any other reason, so a misconfigured runner
  # degrades to a skip, never a blocking failure (job is `optional`).
  - python3 -m pip install "amd-mori==1.2.2" "flydsl==0.2.4"
ut:
  commands:
    # Real all-to-all dispatch/combine across 2 ranks: bf16 + native mxfp4 vs a replicated
    # full-MoE reference. The test self-skips (see -rs output) if MORI/flydsl are missing or
    # world size < 2, so a misconfigured runner degrades to a skip, not a blocking failure.
    - torchrun --standalone --nproc-per-node=2 -m pytest tokenspeed-kernel/test/ops/moe/test_mori_ep_distributed_gfx950.py -v -rs
report:
  github_step_summary: true
