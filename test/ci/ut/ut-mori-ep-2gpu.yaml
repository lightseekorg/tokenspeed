api_version: ci.tokenspeed.io/v1
name: ut-mori-ep-2gpu
type: ut
workflow_stage: unit-test
# MORI is AMD-only and builds gfx950 dispatch/combine kernels from source, so this
# job runs on a 2-GPU MI350X runner. Kept `optional` (continue-on-error) and
# manual/per-commit until the ROCm CI image ships MORI + flydsl by default; promote
# to a required per-commit gate once the runner provides them out of the box.
triggers:
  - manual
  - per-commit
optional: true
runner:
  labels:
    - amd-mi35x-2gpu-test
env:
  CI: "true"
  MORI_PER_RANK_VMM: "4294967296"
install:
  - bash test/ci_system/install_deps.sh
  # MORI EP deps from the pre-built PyPI wheel (amd-mori) — no source build, no
  # build-time hipcc/cmake. The wheel ships the compiled libmori_*.so and the v2
  # dispatch_combine API this backend uses; the [flydsl] extra pulls the runtime JIT
  # dep for the v2 device kernels (compiled on the runner's ROCm at first use).
  # NOTE: the wheel's .so links libgrpc++.so.1.51 (Ubuntu: libgrpc++1.51t64) at
  # runtime — provide it in the runner image if absent. This job is `optional` and the
  # test self-skips via mori_available() (which catches import errors), so a missing
  # grpc/ROCm dep surfaces as a skip, never a blocking failure.
  - python3 -m pip install "amd-mori[flydsl]==1.2.2"
ut:
  commands:
    # Real all-to-all dispatch/combine across 2 ranks: bf16 + native mxfp4 vs a
    # replicated full-MoE reference. The test self-skips if MORI/flydsl are missing
    # or world size < 2, so a misconfigured runner degrades to a skip, not a failure.
    - torchrun --standalone --nproc-per-node=2 -m pytest tokenspeed-kernel/test/ops/moe/test_mori_ep_distributed_gfx950.py -v
report:
  github_step_summary: true
