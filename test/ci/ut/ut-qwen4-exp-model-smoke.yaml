api_version: ci.tokenspeed.io/v1
name: ut-qwen4-exp-model-smoke
type: ut
workflow_stage: unit-test
triggers:
  - manual
  - slurm
runner:
  labels:
    - gb200-2gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  commands:
    # Fresh processes release each Engine's workers before loading the next mode.
    # Both graph modes repeat actual batches of sizes 1 and 4 in the same Engine.
    - >-
      timeout --signal=TERM --kill-after=30s 3600s
      python3 test/ci_system/smoke_qwen4_exp.py --mode non-spec
    - >-
      timeout --signal=TERM --kill-after=30s 3600s
      python3 test/ci_system/smoke_qwen4_exp.py --mode mtp-eager
    - >-
      timeout --signal=TERM --kill-after=30s 3600s
      python3 test/ci_system/smoke_qwen4_exp.py --mode mtp-graph
report:
  github_step_summary: true
