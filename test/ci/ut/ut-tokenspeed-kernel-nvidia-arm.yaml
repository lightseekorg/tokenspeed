api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel-nvidia-arm
type: ut
workflow_stage: unit-test
triggers:
  - slurm
runner:
  labels:
    - slurm-nvidia-arm-4gpu
slurm:
  nodes: 1
  gpus_per_node: 4
env:
  CI: "true"
  CUDA_HOME: /usr/local/cuda-13.4
  PATH: /usr/local/cuda-13.4/bin:/home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  LD_LIBRARY_PATH: /usr/local/cuda-13.4/lib64:/opt/tokenspeed-cuda-runtime:/usr/lib/aarch64-linux-gnu
  LD_PRELOAD: /usr/local/cuda-13.4/lib64/libcupti.so.13:/usr/local/cuda-13.4/lib64/libnvrtc.so.13
  TRITON_PTXAS_PATH: /usr/local/cuda-13.4/bin/ptxas
install:
  - python3 -m pip install --break-system-packages pytest==9.1.1 pytest-xdist -r tokenspeed-kernel/python/requirements/cuda.txt -r tokenspeed-kernel/python/requirements/cuda-thirdparty.txt compressed-tensors pybase64 pyzmq pillow fastapi
  - TOKENSPEED_KERNEL_BACKEND=cuda python3 tokenspeed-kernel/python/setup.py build_ext
ut:
  commands:
    - python3 -c 'import torch; assert torch.cuda.get_device_capability() == (10, 7)'
    - python3 -m pytest tokenspeed-kernel/test/nvidia/thirdparty/test_deep_gemm.py -v --junitxml=/tmp/deepgemm.xml
    - python3 -m pytest tokenspeed-kernel/test/ops/test_attention_dsv4_dcp.py::test_flashmla_partials_merge_to_the_full_softmax_with_empty_shards -v --junitxml=/tmp/flashmla.xml
    - PYTHONPATH=tokenspeed-mla/python python3 -m pytest tokenspeed-mla/tests/test_mla_decode.py::TestGPU -v --junitxml=/tmp/mla.xml
    - >-
      python3 -c 'import xml.etree.ElementTree as ET;
      counts = [ET.parse(path).getroot().find("testsuite").attrib
      for path in ("/tmp/deepgemm.xml", "/tmp/flashmla.xml", "/tmp/mla.xml")];
      assert [int(c["tests"]) for c in counts[:2]] == [2, 4]
      and int(counts[2]["tests"]) > 0
      and all(int(c["skipped"]) == 0 for c in counts)'
    - python3 -m pytest tokenspeed-kernel/test/test_numerics.py -v --junitxml=/tmp/kernel-numerics.xml
    - python3 -m pytest tokenspeed-kernel/test/nvidia/thirdparty/test_trtllm_comm.py -v --junitxml=/tmp/kernel-trtllm-comm.xml
    - PYTHONPATH="python${PYTHONPATH:+:$PYTHONPATH}" python3 -m pytest tokenspeed-kernel/test/nvidia/thirdparty/test_cuda.py -v --junitxml=/tmp/kernel-cuda.xml
    - bash test/ci_system/run_kernel_gpu_ut.sh
report:
  github_step_summary: true
