api_version: ci.tokenspeed.io/v1
# The gfx950 monokernel tests on eight GPUs: the directory, so a new
# multi-rank test runs without being listed. The one-GPU kernel task
# (ut-tokenspeed-kernel, amd-mi355-1gpu) skips the TP8 launches of the Muse
# Spark layer, its stages and its draft; the directory's one-GPU tests run
# here a second time.
#
# A pull request's changed paths select the files (changed_paths): a change
# naming another op family runs none of them; a change naming no family
# (core modules, conftest, packaging) runs them all.
name: ut-tokenspeed-kernel-amd-8gpu
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
# Kernel tests never import the runtime (a pre-commit hook checks it).
ignore_changes:
  - python/tokenspeed
  - test/runtime
changed_paths: true
runner:
  labels:
    - amd-mi35x-8gpu-test
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps_rocm.sh
ut:
  commands:
    - >-
      python3 -m pytest -v
      tokenspeed-kernel/test/amd/gfx950/ops/monokernel
report:
  github_step_summary: true
