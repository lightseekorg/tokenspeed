api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel-post-submit
type: ut
workflow_stage: unit-test
triggers:
  - post-submit
  - manual
runner:
  labels:
    - h100-1gpu
    - b200-1gpu
    - gb200-1gpu
    - b300-1gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  commands:
    - python3 -m pytest tokenspeed-kernel/test/nvidia/ops/test_gemm_autotune_capacity_formats.py -v
report:
  github_step_summary: true
