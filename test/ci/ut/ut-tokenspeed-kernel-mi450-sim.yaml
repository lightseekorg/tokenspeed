    --deselect=tokenspeed-kernel/test/ops/attention/test_gluon_dsa_amd.py::test_dsa_glm52_selected_attention_cases[decode_sparse_long_1024]
    --deselect=tokenspeed-kernel/test/ops/attention/test_gluon_dsa_amd.py::test_dsa_glm52_selected_attention_cases[decode_sparse_mixed_512]
