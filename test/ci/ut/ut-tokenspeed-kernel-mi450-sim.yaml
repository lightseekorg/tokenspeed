api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel-mi450-sim
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
  - debug
runner:
  labels:
    - amd-mi45x-cpu-test
env:
  BUILD_AND_DOWNLOAD_PARALLEL: "4"
  CI: "true"
  GFX_ARCH: gfx1250
  # Keep emulation within the PR lane's ten-minute execution budget.
  MI450_SIM_RUN_TIMEOUT: "600"
  # Keep rocJITsu from selecting host-wide thread presets: the pod's 32-CPU
  # cgroup quota does not narrow the host affinity visible inside the runner.
  MI450_SIM_THREADS_PER_WORKER: "2"
  # A ceiling on concurrent simulators. Each simulator uses the budget above.
  MI450_SIM_WORKERS: "16"
  # rocJITsu is a functional simulator, so run architecture-specific compile and
  # launch coverage here. Generic tests remain covered on AMD hardware; the
  # production-sized MXFP4 MoE tests alone exceed this lane's budget, so only
  # reduced-size MXFP4 MoE cases run here.
  MI450_SIM_TEST_ROOT: tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_tile_shapes
  MI450_SIM_TESTS: |
    # MHA prefill beyond the root's tile shapes: selected packed GQA on full,
    # ragged and 512-window rows, forced packed FP16, the TDM warp hint and
    # reversed Q blocks at two heads, and host selectors no other lane runs.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_selected_packed_gqa[full-tiles]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_selected_packed_gqa[guarded-rows]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_selected_packed_gqa[window512]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_packed_gqa[2-dtype1]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_tdm_warp_hint_remainder[sim]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_reverse_q_blocks_ragged[sim]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_select_llvm_fn_attrs
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_select_deep_pipeline
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_select_packed_gqa
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_select_tdm_warp_hint
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_select_reverse_q_blocks
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_select_m_tile_gates
    # MHA decode: peeled split KV plus reduce.
    tokenspeed-kernel/test/ops/test_attention.py::test_mha_decode_with_kvcache_gluon_peeled_split
    # MLA decode: 16-head by 64-KV blocks, projected value against the split
    # path, and the 12-head split query projection; BF16 extend.
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_decode_with_kvcache[gluon-bh16bn64]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_decode_with_kvcache_projected_value_matches_split[1]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_extend_with_kvcache[bf16]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_normalize_project_query_split_output[12]
    # MLA prefill: FP8 KV pack with a tail tile and a broadcast RoPE key,
    # causal FP8 12-head prefill over query-tile tails, and the batched value
    # projection.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mla_kv_pack.py::test_gluon_mla_kv_pack_quantize_fp8[2-fp8_dtype0-7]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mla_kv_pack.py::test_gluon_mla_kv_pack_quantize_fp8[3-fp8_dtype1-2048]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_prefill[query-tile-tails-with-prefix-causal-gluon-fp8-e4m3-12]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_project_value_amd_batches[8]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.mla_project_value/gluon_mla_project_value_gfx1250/batch8-sigmoid-gate@mi450]
    # KDA: native-layout paged prefill, specialized paged decode, fused paged
    # decode, and all-layer replay with uneven cache groups.
    tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_paged_prefill_preserves_native_state_layout
    tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_paged_decode_defaults_to_specialized_kernel_on_amd[2-8-8-False--5.0]
    tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_fused_paged_decode_matches_reference[1-1]
    tokenspeed-kernel/test/ops/attention/test_kda_replay_commit.py::test_gluon_batched_replay_uneven_groups_match_per_layer_launches
    # DeepSeek V4.1 index top-k: CSA2 scoring, reindexing, missing and
    # out-of-table latest pages, arena page strides.
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv41_index_topk/gluon_dsv41_index_topk_gfx1250@mi450]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_full_and_reindex_gluon[65-17-32]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_missing_latest_page[-1-gluon]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_missing_latest_page[3-gluon]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_latest_block_outside_table[320-31-gluon]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_preserves_arena_page_stride[True-1]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_preserves_arena_page_stride[True-2]
    # DeepSeek V4.1 fused selected attention, with and without the global cache.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_selected.py::test_fused_gluon_is_selected_on_supported_amd
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_selected.py::test_fused_selected_attention_matches_gather_softmax[True-16]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_selected.py::test_fused_selected_attention_matches_gather_softmax[False-7]
    # GLM-5.2 DSA: FP8 top-k decode and prefill, rank-128 BF16 dense cache.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_topk_fp8_glm52_cases[decode_trivial_q2_2048]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_prefill_topk_fp8_glm52_cases[prefill_short_512]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_dense_kvcache[rank_128-q_bf16-decode]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_dense_kvcache[rank_128-q_bf16-prefill]
    # GLM-5.3-Flash full attention: 256-wide NoPE scores, rank-512 values, the
    # 2051-slot KPool-plus-tail ABI in both stages, standard-cache graph replay.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_glm53_flash_bf16_split_matrix[16]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_prefill_glm53_flash_zero_length_rows_are_zero
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsa_decode_glm53_flash_bf16_dense/gluon_dsa_decode_gfx1250@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsa_prefill_glm53_flash_bf16_dense/gluon_dsa_prefill_gfx1250@mi450]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_standard_cache.py::test_standard_cache_decode_cuda_graph_replays_changed_inputs[1]
    # GLM-5.3 KPool: Wave32 scoring, ordered head fold, logical radix top-k,
    # plan-aware expansion.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_kpool_score.py::test_kpool_prefill_logits_match_weighted_relu_and_local_window[weight_dtype0-13-173-0-False]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_kpool_score.py::test_kpool_ordered_head_fold_matches_sequential_signed_reference
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_gluon_logical_topk_indices_respects_ragged_ranges_and_outputs
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_kpool_plan.py::test_short_plan_has_stable_logical_order_and_flatkv_boundaries
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_kpool_plan.py::test_plan_radix_path_matches_reference_after_deterministic_threshold
    # DSA paths the GLM cases miss: packed E4M3 rows (WMMA split-K plus
    # reduce), tiny-length top-k trimming, standard-cache prefill logits.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_with_sparse_kvcache[q_bf16-decode]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_with_sparse_kvcache[q_e4m3-prefill]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_sparse_kvcache_trims_large_topk_for_tiny_lens
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_standard_cache.py::test_standard_cache_prefill_uses_workspace_rows_not_global_slots[32-q_dtype0-weight_dtype0]
    # Argmax: split and non-power-of-two reductions, TDM padding masks,
    # partial tiles, NaN, graph capture, scratch ownership.
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_matches_torch_for_model_shapes[1-bf16-dsv4]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_matches_torch_for_model_shapes[17-fp32-glm_5_3_flash]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_masks_padding_with_negative_logits[16385-129-fp16]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_strided_rows_and_partial_tiles[513-8192]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_ignores_nan_but_preserves_valid_negative_infinity[4]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_out_buffer_under_cuda_graph[16]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_first_capture_does_not_cache_graph_pool_scratch
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/sampling.argmax/gluon_argmax_gfx1250@mi450]
    # Kimi K3 BF16 GEMMs: M=16 add3 in Gluon and Triton, strided shared-down,
    # dense-M16 TDM through the M=17 decode GEMV, large-M o_proj. QKV-gate and
    # 512-token latent projections reuse these kernels and stay on hardware.
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_m16_add3_auto_matches_composed_and_captures
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_shared_down_strided_output_contract
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_shared_down_strided_inputs_use_torch
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_gfx1250_large_m_linear_o_proj_shape_matches
    tokenspeed-kernel/test/ops/gemm/test_decode_gemv.py::test_cdna5_route_admits_decode_shapes[7168-1536-17]
    # Kimi K3 dense BF16 and AttnRes: split-K reduce, short TDM tails, batch
    # compile reuse, seven-buffer QKVFAB, AttnRes partials and entry point.
    tokenspeed-kernel/test/amd/ops/test_dense_bf16_gfx1250.py
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_kda_qkvfab_tdm_auto_matches_and_captures[2]
    tokenspeed-kernel/test/ops/test_gemm.py::test_linear_attnres_partials_gfx1250_matches_composition[3648]
    tokenspeed-kernel/test/ops/test_gemm.py::test_linear_attnres_partials_gfx1250_cuda_graph_replay[6288]
    tokenspeed-kernel/test/amd/ops/test_kimi3_prefill_gluon_amd.py::test_attn_res_amd_entrypoint_accepts_legacy_keywords
    # Kimi K3 MoE front end: reduced latent-input decode pipeline, sigmoid-bias
    # routing with and without renormalization, fused softmax top-k.
    tokenspeed-kernel/test/amd/ops/moe/test_gluon_latent_input_gfx1250.py::test_decode_pipeline[sim]
    tokenspeed-kernel/test/amd/ops/test_kimi3_sigmoid_topk_amd.py::test_prefill_sigmoid_bias_topk_matches_torch_and_captures[1.0-False]
    tokenspeed-kernel/test/amd/ops/test_kimi3_sigmoid_topk_amd.py::test_prefill_sigmoid_bias_topk_matches_torch_and_captures[2.5-True]
    tokenspeed-kernel/test/ops/moe/test_softmax_topk.py::test_triton_matches_softmax_topk[2-896-16-dtype4-True]
    tokenspeed-kernel/test/ops/moe/test_softmax_topk.py::test_triton_matches_softmax_topk[7-16-3-dtype3-False]
    tokenspeed-kernel/test/ops/moe/test_softmax_topk.py::test_public_entry_point_is_cuda_graph_capturable
    # MXFP4 MoE at four experts: static FP8-activation prefill and small-M
    # decode, routing and weighted top-k with invalid expert ids.
    tokenspeed-kernel/test/amd/ops/moe/test_gluon_mxfp4_amd.py::test_static_fp8_activation_moe_gfx1250[prefill-default]
    tokenspeed-kernel/test/amd/ops/moe/test_gluon_mxfp4_amd.py::test_static_fp8_activation_moe_gfx1250[decode-small-m-wmma-layout]
    tokenspeed-kernel/test/amd/ops/moe/test_gluon_mxfp4_amd.py::test_gfx1250_large_m_route_handles_duplicates_invalid_ids_and_block64
    tokenspeed-kernel/test/amd/ops/moe/test_gluon_mxfp4_amd.py::test_gfx1250_small_m_route_ignores_invalid_experts
    tokenspeed-kernel/test/amd/ops/moe/test_gluon_mxfp4_amd.py::test_gfx1250_weighted_topk_reduce_masks_invalid_rows
    # MXFP8 and FP8 block-scale decode GEMV: UE8M0 and FP32 scales, split-K,
    # native WMMA pipeline, fused TDM, public mm selection.
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_mxfp8_ue8m0_gemv_matches_dequantized_reference[16-256-288]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_mxfp8_split_k_matches_direct[ue8m0-576-5120-5]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_gfx1250_gemv_uses_native_pipeline[ue8m0-16-5120-v_wmma_scale_f32_16x16x128_f8f6f4]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_fp8_blockscale_gemv_matches_dequantized_reference[1-128-128]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_fp8_blockscale_gemv_matches_dequantized_reference[16-256-512]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_mxfp8_split_k_matches_direct[fp32-128-4096-2]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_gfx1250_gemv_uses_native_pipeline[fp32-128-7168-v_wmma_f32_16x16x128_fp8_fp8]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_fp8_blockscale_fused_tdm_matches_single_wave
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_mxfp8_split_k_selection[fp32-15-1536-4096-4]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_mxfp8_split_k_selection[ue8m0-16-1792-5120-5]
    tokenspeed-kernel/test/amd/ops/gemm/test_gluon_mxfp8_gfx1250.py::test_mxfp8_tdm_fusion_selection[fp32-16-2048-7168-1-0]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_public_mm_selects_gfx1250_decode_kernel[ue8m0-False-gluon_mm_mxfp8_ue8m0_gfx1250]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_public_mm_selects_gfx1250_decode_kernel[fp32-True-gluon_mm_fp8_blockscale_gfx1250]
  ROCM_NIGHTLY_INDEX: https://nightly.repo.amd.com/rocm/whl-next/
  # The PyTorch nightly requires this exact ROCm SDK build.
  ROCM_SDK_VERSION: 10.2.0a20261010
  # The rocm-systems revision that this ROCm SDK nightly was built from, as
  # recorded in its share/therock/therock_manifest.json.
  ROCM_SYSTEMS_REF: d5c528019d0fcfbbc32d96b53ac2c61df6d0e67d
  TORCH_DEVICE_PACKAGE: amd-torch-device-gfx1250==2.14.0+rocm10.2.0a20261010
  TORCH_INDEX_URL: https://nightly.repo.amd.com/rocm/whl-next/
  TORCH_VERSION: 2.14.0+rocm10.2.0a20261010
  TORCHVISION_VERSION: 0.29.0+rocm10.2.0a20261010
install:
  - bash test/ci_system/setup_mi450_sim.sh
  - WORKSPACE="$(pwd)" bash test/ci_system/install_deps_rocm.sh
ut:
  commands:
    - >-
      bash test/ci_system/run_mi450_rocjitsu.sh
      python3 -c
      'import torch; print("HIP", torch.version.hip, "available",
      torch.cuda.is_available(), "devices", torch.cuda.device_count(), flush=True);
      torch.cuda.init(); props = torch.cuda.get_device_properties(0);
      print(props, flush=True); assert "gfx1250" in props.gcnArchName'
    - >-
      bash test/ci_system/run_mi450_rocjitsu_parallel.sh
      -v --timeout=300
      $(printf '%s\n' "${MI450_SIM_TESTS}" | awk 'NF && $1 !~ /^#/')
report:
  github_step_summary: true
