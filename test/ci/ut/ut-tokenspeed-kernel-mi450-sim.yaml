    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_decode_matches_reference[2-production-16-rows]
    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_decode_matches_reference[4-portable]
    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_decode_matches_reference[4-production]
    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_decode_matches_reference[4-production-16-rows]
    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_ragged_prefill_parallel_scoring_and_device_sort_match_reference[False-1024]
    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_ragged_prefill_parallel_scoring_and_device_sort_match_reference[False-2048]
    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_ragged_prefill_parallel_scoring_and_device_sort_match_reference[True-1024]
