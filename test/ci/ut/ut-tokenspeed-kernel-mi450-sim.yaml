api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel-mi450-sim
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
  - debug
runner:
  labels:
    - amd-mi45x-cpu-test
env:
  BUILD_AND_DOWNLOAD_PARALLEL: "4"
  CI: "true"
  GFX_ARCH: gfx1250
  MI450_SIM_RUN_TIMEOUT: "1800"
  # A ceiling on concurrent simulators. A simulator takes two CPU threads.
  MI450_SIM_WORKERS: "16"
  TEST_DESELECTS: |
    # Iris symmetric heaps require physical KFD/ARSMI peer topology. rocJITsu
    # provides compute emulation only, so keep these tests enabled on hardware.
    --deselect=tokenspeed-kernel/test/ops/test_iris_communication.py::test_iris_allreduce_residual_rmsnorm_world1[per_row]
    --deselect=tokenspeed-kernel/test/ops/test_iris_communication.py::test_iris_allreduce_residual_rmsnorm_world1[persistent]

    # These tests exceed the rocJITsu CI budget before producing a result.
    --deselect=tokenspeed-kernel/test/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_topk_fp8_accepts_glm52_bf16_split_weights
    --deselect=tokenspeed-kernel/test/ops/attention/test_kda_replay_commit.py::test_batched_replay_checkpoint_boundary_matches_layer_loop
    --deselect=tokenspeed-kernel/test/ops/test_attention.py::test_mha_prefill_lse
    --deselect=tokenspeed-kernel/test/ops/test_attention_gdn.py::test_gdn_chunk_prefill_triton_matches_torch_reference
    --deselect=tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_prefill
    --deselect=tokenspeed-kernel/test/ops/test_conv.py::test_sconv_decode[300-2048]
    --deselect=tokenspeed-kernel/test/ops/test_conv.py::test_sconv_decode[300-6144]
    --deselect=tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_fused_paged_decode_matches_reference[32-32]
    --deselect=tokenspeed-kernel/test/ops/test_qwen4_exp_qsa.py::test_qwen4_exp_qsa_block_topk_logits_matches_stream
    --deselect=tokenspeed-kernel/test/ops/test_sampling_cute_dsl.py::test_argmax_matches_torch_for_kernel_shapes[128-151936]
    --deselect=tokenspeed-kernel/test/ops/test_sampling_cute_dsl.py::test_argmax_matches_torch_for_kernel_shapes[128-163840]
    --deselect=tokenspeed-kernel/test/ops/test_sampling_cute_dsl.py::test_argmax_matches_torch_for_kernel_shapes[128-200064]
    --deselect=tokenspeed-kernel/test/ops/test_sampling_cute_dsl.py::test_argmax_matches_torch_for_kernel_shapes[128-201088]
    --deselect=tokenspeed-kernel/test/ops/test_sampling_cute_dsl.py::test_argmax_matches_torch_for_kernel_shapes[199-151936]
    --deselect=tokenspeed-kernel/test/ops/test_sampling_cute_dsl.py::test_argmax_under_cuda_graph[64-201088]

    # rocJITsu returns incorrect values converting FP8 E4M3 to float.
    # https://github.com/ROCm/rocm-systems/issues/10760
    --deselect=tokenspeed-kernel/test/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_sparse_kvcache_trims_large_topk_for_tiny_lens
    --deselect=tokenspeed-kernel/test/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_topk_fp8_glm52_cases[decode_batch_mixed_512]
    --deselect=tokenspeed-kernel/test/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_topk_fp8_glm52_cases[decode_long_1024]
