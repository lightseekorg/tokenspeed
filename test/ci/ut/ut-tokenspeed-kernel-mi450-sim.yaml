    --deselect=tokenspeed-kernel/test/ops/test_kpool_select.py::test_decode_cuda_graph_tracks_dynamic_lengths
    --deselect=tokenspeed-kernel/test/test_numerics.py::TestNumericsVerification::test_gemm_fp8[gemm.bmm:triton_bmm_fp8_blockscale]
    --deselect=tokenspeed-kernel/test/test_numerics.py::TestNumericsVerification::test_gemm_fp8[gemm.mm:triton_mm_fp8_blockscale]

    # rocJITsu ignores clamp on v_subrev_nc_u32_e64:
    # https://github.com/ROCm/rocm-systems/issues/10762
    --deselect=tokenspeed-kernel/test/ops/moe/test_triton_mxfp4_apply.py::test_triton_mxfp4_moe_matches_torch[silu]
    --deselect=tokenspeed-kernel/test/ops/moe/test_triton_mxfp4_apply.py::test_triton_mxfp4_moe_matches_torch[situ]

    # rocJITsu drops scalar-memory loads targeting vcc_lo:
    # https://github.com/ROCm/rocm-systems/issues/10768
