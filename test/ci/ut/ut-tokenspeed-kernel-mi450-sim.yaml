api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel-mi450-sim
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
  - debug
runner:
  labels:
    - amd-mi45x-cpu-test
env:
  BUILD_AND_DOWNLOAD_PARALLEL: "4"
  CI: "true"
  GFX_ARCH: gfx1250
  # Keep emulation within the PR lane's five-and-a-half-minute execution budget.
  MI450_SIM_RUN_TIMEOUT: "330"
  # A ceiling on concurrent simulators. A simulator takes two CPU threads.
  MI450_SIM_WORKERS: "16"
  # rocJITsu is a functional simulator, so run architecture-specific compile and
  # launch coverage here. Generic tests and the production-sized MXFP4 MoE test
  # remain covered on AMD hardware; MXFP4 MoE alone exceeds this lane's budget.
  MI450_SIM_TEST_ROOT: tokenspeed-kernel/test/amd/ops/attention/test_gluon_mha_prefill_gfx1250.py::test_mha_prefill_tile_shapes
  MI450_SIM_TESTS: |
    # DeepSeek V4.1 CSA2 scoring, reindexing, and invalid-page selection.
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv41_index_topk/gluon_dsv41_index_topk_gfx1250@mi450]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_full_and_reindex_gluon[65-17-32]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_missing_latest_page[-1-gluon]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_missing_latest_page[3-gluon]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_latest_block_outside_table[320-31-gluon]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_preserves_arena_page_stride[True-1]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_index_topk.py::test_index_topk_preserves_arena_page_stride[True-2]
    tokenspeed-kernel/test/ops/test_attention.py::test_mha_decode_with_kvcache_gluon_peeled_split
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_decode_with_kvcache[gluon-bh16bn64]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_extend_with_kvcache[bf16]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_decode_with_kvcache_projected_value_matches_split[1]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_normalize_project_query_split_output[12]
    tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_paged_prefill_preserves_native_state_layout
    tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_paged_decode_defaults_to_specialized_kernel_on_amd[2-8-8-False--5.0]
    tokenspeed-kernel/test/ops/test_kda_recurrent.py::test_kda_fused_paged_decode_matches_reference[1-1]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_topk_fp8_glm52_cases[decode_trivial_q2_2048]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_prefill_topk_fp8_glm52_cases[prefill_short_512]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_dense_kvcache[rank_128-q_bf16-decode]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_dense_kvcache[rank_128-q_bf16-prefill]
    # GLM-5.3-Flash full attention: native 256-wide NoPE score geometry,
    # rank-512 values, and the 2051-slot KPool-plus-tail ABI in both stages.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_glm53_flash_bf16_split_matrix[16]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_prefill_glm53_flash_zero_length_rows_are_zero
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsa_decode_glm53_flash_bf16_dense/gluon_dsa_decode_gfx1250@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsa_prefill_glm53_flash_bf16_dense/gluon_dsa_prefill_gfx1250@mi450]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_standard_cache.py::test_standard_cache_decode_cuda_graph_replays_changed_inputs[1]
    # GLM-5.3 KPool Wave32 scoring, logical radix top-k, and plan-aware expansion.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_kpool_score.py::test_kpool_prefill_logits_match_weighted_relu_and_local_window[weight_dtype0-13-173-0-False]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_kpool_score.py::test_kpool_ordered_head_fold_matches_sequential_signed_reference
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_gluon_logical_topk_indices_respects_ragged_ranges_and_outputs
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_kpool_plan.py::test_short_plan_has_stable_logical_order_and_flatkv_boundaries
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_kpool_plan.py::test_plan_radix_path_matches_reference_after_deterministic_threshold
    tokenspeed-kernel/test/amd/ops/test_kimi3_prefill_gluon_amd.py::test_attn_res_amd_entrypoint_accepts_legacy_keywords
    # Gluon argmax: split reduction, non-power-of-two split count,
    # pipelined TDM with zero-padding masking, single-tile rows, NaN handling,
    # graph capture and scratch ownership.
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_matches_torch_for_model_shapes[1-bf16-dsv4]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_matches_torch_for_model_shapes[17-fp32-glm_5_3_flash]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_masks_padding_with_negative_logits[16385-129-fp16]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_strided_rows_and_partial_tiles[513-8192]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_ignores_nan_but_preserves_valid_negative_infinity[4]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_out_buffer_under_cuda_graph[16]
    tokenspeed-kernel/test/amd/ops/sampling/test_gluon_argmax_gfx950.py::test_argmax_first_capture_does_not_cache_graph_pool_scratch
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/sampling.argmax/gluon_argmax_gfx1250@mi450]
    # DeepSeek V4 portable Triton path: one case per code path.
    tokenspeed-kernel/test/ops/attention/test_triton_dsv4_indexer.py::test_decode_logits_and_topk[64-2048]
    tokenspeed-kernel/test/ops/attention/test_triton_dsv4_indexer.py::test_prefill_ragged_candidates[True]
    tokenspeed-kernel/test/ops/attention/test_triton_dsv4_indexer.py::test_decode_graph_refresh_and_padding
    # DeepSeek V4 indexer: buffer-load prefill/decode, native TDM decode,
    # radix top-k, padded page strides, and graph-stable plan refresh.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_indexer_gfx1250.py::test_decode_logits_and_topk[64-2048]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_indexer_gfx1250.py::test_prefill_ragged_candidates_and_int64_base_offsets
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_indexer_gfx1250.py::test_decode_tdm_threshold_logits
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_indexer_gfx1250.py::test_decode_graph_refresh_and_plan_aliasing
    tokenspeed-kernel/test/ops/attention/test_triton_dsv4_attention.py::test_selected_attention_and_graph_replay[True-64]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_matches_reference[True-False-dtype0-plain]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_matches_reference[True-False-dtype1-bias]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_matches_reference[True-False-dtype2-hash]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_matches_reference[False-True-dtype0-hash]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_matches_reference[False-True-dtype1-plain]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_matches_reference[False-True-dtype2-bias]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_ties_and_graph_replay
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_nan_logits_keep_expert_ids_in_range[True]
    tokenspeed-kernel/test/ops/moe/test_triton_dsv4_router.py::test_router_to_mxfp4_experts[17]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_prefill_topk/gluon_dsv4_prefill_topk_mxfp4_gfx1250/mxfp4@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_decode_topk/gluon_dsv4_decode_topk_mxfp4_gfx1250/mxfp4@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/moe.dsv4_select_experts/triton_dsv4_select_experts/bias-tokens17@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/moe.dsv4_select_experts/triton_dsv4_select_experts/hash@mi450]
    # DeepSeek V4 Gluon paged decode, one case per host-side specialization:
    # the Pro TP8 shape (16 heads, 4-warp head block, split KV plus reduce),
    # a 16-row page with a padded stride, ragged widths and a BF16 sink,
    # SWA-only with 128 heads (8-warp head block, two head blocks,
    # unaligned stride), graph replay with refreshed lengths and slots, a
    # separate page size per cache, and the 64-bit address fallback for pages
    # beyond 2 GiB.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_decode_gfx1250.py::test_decode[64-0-1-16-128-1024]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_decode_gfx1250.py::test_decode[16-64-2-8-65-33]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_decode_gfx1250.py::test_decode[64-2-17-128-128-0]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_decode_gfx1250.py::test_graph_replay_refreshes_lengths_and_slots[3-32]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_decode_gfx1250.py::test_independent_page_sizes_and_allocated_output
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_decode_gfx1250.py::test_cache_offsets_beyond_signed_int32[2147483650]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_decode/gluon_dsv4_decode_gfx1250/pro-tp8@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_decode/gluon_dsv4_decode_gfx1250/swa-only@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_decode/triton_dsv4_decode/pro-tp8-int64-metadata@mi450]
    # DeepSeek V4 Gluon dense prefill: both serving widths, one
    # with a full 16-head block and one with a partial block.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_prefill.py::test_gluon_dsv4_prefill_is_selected_for_serving_widths
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_prefill.py::test_gluon_dsv4_prefill_matches_reference[16-128]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv4_prefill.py::test_gluon_dsv4_prefill_matches_reference[7-640]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_prefill/gluon_dsv4_prefill_gfx1250/width128@mi450]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.dsv4_prefill/gluon_dsv4_prefill_gfx1250/width640@mi450]
    # DeepSeek V4.1 fused two-reader selected attention: with and
    # without the global cache.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_selected.py::test_fused_gluon_is_selected_on_supported_amd
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_selected.py::test_fused_selected_attention_matches_gather_softmax[True-16]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsv41_selected.py::test_fused_selected_attention_matches_gather_softmax[False-7]
    # DSA packed E4M3 rows (Wave32 WMMA split-K plus reduce) and the
    # standard-cache prefill logits kernel, which the GLM cases above never
    # reach.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_with_sparse_kvcache[q_bf16-decode]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_with_sparse_kvcache[q_e4m3-prefill]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_amd.py::test_dsa_decode_sparse_kvcache_trims_large_topk_for_tiny_lens
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_dsa_standard_cache.py::test_standard_cache_prefill_uses_workspace_rows_not_global_slots[32-q_dtype0-weight_dtype0]
    # MLA beyond decode: FP8 KV packing with a tail tile and with a
    # broadcast RoPE key, the causal FP8 12-head prefill over query-tile
    # tails, and the batched value projection.
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mla_kv_pack.py::test_gluon_mla_kv_pack_quantize_fp8[2-fp8_dtype0-7]
    tokenspeed-kernel/test/amd/ops/attention/test_gluon_mla_kv_pack.py::test_gluon_mla_kv_pack_quantize_fp8[3-fp8_dtype1-2048]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_prefill[query-tile-tails-with-prefix-causal-gluon-fp8-e4m3-12]
    tokenspeed-kernel/test/ops/test_attention_mla.py::test_mla_project_value_amd_batches[8]
    tokenspeed-kernel/test/test_kernel_api_selection.py::test_kernel_api_selection[cdna5/attention.mla_project_value/gluon_mla_project_value_gfx1250/batch8-sigmoid-gate@mi450]
    # Kimi K3 BF16 GEMMs: the M=16 add3 fusion in both its Gluon and Triton
    # forms, the dense-M16 TDM kernel through the routed decode GEMV (M=17
    # masks a tail chunk), and the large-M kernel through the o_proj shape.
    # The QKV-gate and QKVFAB projections reuse the dense-M16 kernel and
    # the 512-token latent projection reuses the large-M kernel at several
    # times the cost, so those stay on AMD hardware.
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_m16_add3_auto_matches_composed_and_captures
    tokenspeed-kernel/test/amd/ops/test_kimi3_projection_gfx1250.py::test_kimi3_gfx1250_large_m_linear_o_proj_shape_matches
    tokenspeed-kernel/test/ops/gemm/test_routed_gemv.py::test_cdna5_route_admits_decode_shapes[7168-1536-17]
    # Kimi K3 MoE front end: the single-token latent-input decode specialist
    # under graph replay, prefill sigmoid-bias routing with and without weight
    # normalization, and the fused softmax top-k.
    tokenspeed-kernel/test/ops/moe/test_latent_input.py::test_gfx1250_latent_input_decode_matches_and_replays
    tokenspeed-kernel/test/amd/ops/test_kimi3_sigmoid_topk_amd.py::test_prefill_sigmoid_bias_topk_matches_torch_and_captures[1.0-False]
    tokenspeed-kernel/test/amd/ops/test_kimi3_sigmoid_topk_amd.py::test_prefill_sigmoid_bias_topk_matches_torch_and_captures[2.5-True]
    tokenspeed-kernel/test/ops/moe/test_softmax_topk.py::test_triton_matches_softmax_topk[2-896-16-dtype4-True]
    tokenspeed-kernel/test/ops/moe/test_softmax_topk.py::test_triton_matches_softmax_topk[7-16-3-dtype3-False]
    tokenspeed-kernel/test/ops/moe/test_softmax_topk.py::test_public_entry_point_is_cuda_graph_capturable
  TORCH_DEVICE_PACKAGE: amd-torch-device-gfx1250==2.14.0+rocm10.1.0a20260822
  TORCH_INDEX_URL: https://rocm.nightlies.amd.com/whl-multi-arch/
  TORCH_VERSION: 2.14.0+rocm10.1.0a20260822
  TORCHVISION_VERSION: 0.29.0a0+rocm10.1.0a20260822
install:
  - bash test/ci_system/setup_mi450_sim.sh
  - WORKSPACE="$(pwd)" bash test/ci_system/install_deps_rocm.sh
ut:
  commands:
    - >-
      bash test/ci_system/run_mi450_rocjitsu.sh
      python3 -c
      'import torch; print("HIP", torch.version.hip, "available",
      torch.cuda.is_available(), "devices", torch.cuda.device_count(), flush=True);
      torch.cuda.init(); props = torch.cuda.get_device_properties(0);
      print(props, flush=True); assert "gfx1250" in props.gcnArchName'
    - >-
      bash test/ci_system/run_mi450_rocjitsu_parallel.sh
      -v --timeout=300
      $(printf '%s\n' "${MI450_SIM_TESTS}" | awk 'NF && $1 !~ /^#/')
report:
  github_step_summary: true
