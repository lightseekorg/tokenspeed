api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - h100-1gpu
    - b200-1gpu
    - gb200-1gpu
    - b300-1gpu
    - amd-mi35x-1gpu-test
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  # A wedged GPU can leave pytest silent until GitHub cancels the 60-minute job.
  # Bound each command so the latest-main retry workflow sees a real failure.
  # If a test stalls, faulthandler dumps thread stacks before timeout stops it.
  commands:
    - timeout -k 1m "${CI_KERNEL_UT_TIMEOUT:-20m}" python3 -m pytest tokenspeed-kernel/test/test_numerics.py -v -o faulthandler_timeout=600
    - timeout -k 1m "${CI_KERNEL_UT_TIMEOUT:-20m}" python3 -m pytest tokenspeed-kernel/test/thirdparty/test_trtllm_comm.py -v -o faulthandler_timeout=600
    - timeout -k 1m "${CI_KERNEL_UT_TIMEOUT:-20m}" python3 -m pytest tokenspeed-kernel/test/thirdparty/test_cuda.py -v -o faulthandler_timeout=600
    - timeout -k 1m "${CI_KERNEL_UT_TIMEOUT:-20m}" python3 -m pytest tokenspeed-kernel/test/ -v --ignore=tokenspeed-kernel/test/test_numerics.py --ignore=tokenspeed-kernel/test/thirdparty/test_trtllm_comm.py --ignore=tokenspeed-kernel/test/thirdparty/test_cuda.py -o faulthandler_timeout=600
report:
  github_step_summary: true
