api_version: ci.tokenspeed.io/v1
name: ut-runtime-qwen35-epd-1e1p2d
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
# The model modules this task serves; pull requests changing only other models skip it.
model_sources:
  - python/tokenspeed/runtime/models/qwen3_5.py
  - python/tokenspeed/runtime/models/qwen3_5_moe.py
  - python/tokenspeed/runtime/models/qwen3_vision.py
runner:
  labels:
    - slurm-gb200-4gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  commands:
    - python3 -m pytest test/runtime/distributed/test_qwen35_epd_1e1p2d.py -v -s
report:
  github_step_summary: true
