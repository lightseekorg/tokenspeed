api_version: ci.tokenspeed.io/v1
name: perf-kimi-k3-mxfp4-tp8ep8-random-4k-1k-mi35x
type: perf
workflow_stage: model-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - amd-mi350-8gpu-bench
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps_rocm.sh
server:
  command: >-
    ts serve
    --model moonshotai/Kimi-K3
    --served-model-name kimi-k3
    --tp 8
    --ep-size 8
    --attention-backend mla
    --moe-backend auto
    --kv-cache-dtype fp8
    --mm-encoder-tp-mode data
    --max-model-len 8192
    --max-num-seqs 1
    --max-cudagraph-capture-size 1
    --cudagraph-capture-sizes 1
    --disable-prefill-graph
    --gpu-memory-utilization 0.92
    --trust-remote-code
    --sampling-backend greedy
    --disable-kvstore
    --kvstore-ratio 0.0
    --no-enable-prefix-caching
    --enable-cache-report
    --host 127.0.0.1
    --port 21000
    --policy round_robin
    --engine-startup-timeout 3000
    --gateway-startup-timeout 600
  ready:
    url: http://127.0.0.1:21000/readiness
    timeout: 3600
    interval: 10
perf:
  install:
    # Keep the load generator aligned with the version used to establish the
    # perf_reference below; EvalScope 1.10 changed its metric semantics.
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]==1.9.1'
  # EvalScope loads remote tokenizer paths through ModelScope even when the
  # dataset source is Hugging Face, so materialize the HF tokenizer locally.
  command: >-
    REPO_ROOT=$PWD &&
    MODEL=kimi-k3 &&
    URL=http://127.0.0.1:21000/v1/completions &&
    OUTPUTS_DIR=/tmp/tokenspeed-kimi-k3-mi35x-perf &&
    TOKENIZER_PATH="$OUTPUTS_DIR/tokenizer" &&
    trap 'rm -rf "$OUTPUTS_DIR"' EXIT &&
    rm -rf "$OUTPUTS_DIR" &&
    /tmp/evalscope-perf/bin/python -c 'import sys; from transformers import AutoTokenizer; AutoTokenizer.from_pretrained("moonshotai/Kimi-K3", trust_remote_code=True).save_pretrained(sys.argv[1])' "$TOKENIZER_PATH" &&
    set +e &&
    echo "==================================================" &&
    echo ">>> input=4k output=1k conc=1" &&
    echo "==================================================" &&
    /tmp/evalscope-perf/bin/evalscope perf
    --model "$MODEL"
    --url "$URL"
    --api openai
    --dataset random
    --data-source huggingface
    --tokenizer-path "$TOKENIZER_PATH"
    --min-prompt-length 4096
    --max-prompt-length 4096
    --prefix-length 0
    --min-tokens 1024
    --max-tokens 1024
    --parallel 1
    --number 1
    --warmup-num 1
    --rate -1
    --seed 1
    --temperature 0
    --stream
    --outputs-dir "$OUTPUTS_DIR/input_4k"
    --no-timestamp
    --extra-args '{"ignore_eos": true}';
    PERF_STATUS=$?;
    python3 "$REPO_ROOT/test/random_benchmark/tokenspeed/collect_outputs.py" "$OUTPUTS_DIR" --num-gpus 8 --emit-csv;
    PARSE_STATUS=$?;
    if [ "$PERF_STATUS" -ne 0 ]; then exit "$PERF_STATUS"; fi;
    exit "$PARSE_STATUS"
report:
  github_step_summary: true
perf_threshold: 0.9
# Values are [Latency (tps/user), Throughput (tps/gpu)]; gate fails any conc whose actual falls below ref * perf_threshold.
# Rounded down from the median of the three most recent passing runs on the 8x
# MI35x runner (67.48/8.09, 65.66/7.88, 65.15/7.79): 65.66 / 7.88.
perf_reference:
  1: [65, 7.8]
