api_version: ci.tokenspeed.io/v1
# Kimi-K3.1 Pro + Kimi-K3.1 DSpark long-context burst (report-only).
name: perf-kimi-k3.1-pro-dspark-mxfp4-tp8-kvp8-random-50k-500-mi35x
type: perf
workflow_stage: model-test
triggers:
  - manual
runner:
  labels:
    - amd-mi350-8gpu-bench
env:
  CI: "true"
  KIMI_K31_GATEWAY_TOKENIZER: /cache/huggingface/kimi-k3.1-gateway-tokenizer
  GPU_MAX_HW_QUEUES: "2"
install:
  - bash test/ci_system/install_deps_rocm.sh
# The server flags are the Kimi-K3.1 AMD recipe in docs/recipes/models.md plus
# the CI-only flags listed in test_eval_configs.py; that test checks the match.
server:
  command: >-
    ts serve
    --model moonshotai/Kimi-K3.1-Pro
    --tokenizer ${KIMI_K31_GATEWAY_TOKENIZER:?K3.1_gateway_tokenizer_not_staged}
    --served-model-name kimi-k3.1
    --trust-remote-code
    --max-model-len 131072
    --kv-cache-dtype fp8
    --dsa-index-k-format mxfp4
    --tensor-parallel-size 8
    --mm-encoder-tp-mode data
    --kv-parallel-size 8
    --decode-context-parallel-size 8
    --speculative-algorithm DSPARK
    --speculative-draft-model-path Inferact/Kimi-K3.1-Pro-DSpark
    --speculative-num-steps 5
    --drafter-attention-backend mha
    --prefill-graph-max-tokens 3072
    --prefill-graph-capture-token-sizes 256 512 1024 1536 2048 3072
    --disable-kvstore
    --enable-startup-requests
    --host 127.0.0.1
    --port 21000
    --policy round_robin
    --engine-startup-timeout 3000
    --gateway-startup-timeout 600
  ready:
    url: http://127.0.0.1:21000/readiness
    timeout: 3600
    interval: 10
perf:
  install:
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]==1.11.1'
  # EvalScope loads remote tokenizer paths through ModelScope even when the
  # dataset source is Hugging Face, so materialize the HF tokenizer locally.
  command: >-
    REPO_ROOT=$PWD &&
    MODEL=kimi-k3.1 &&
    URL=http://127.0.0.1:21000/v1/completions &&
    OUTPUTS_DIR="$PWD/.ci-artifacts/published/kimi-k3.1-pro-dspark-tp8-kvp8-50k-500-perf" &&
    TOKENIZER_PATH="$OUTPUTS_DIR/tokenizer" &&
    rm -rf "$OUTPUTS_DIR" &&
    /tmp/evalscope-perf/bin/python -c 'import sys; from transformers import AutoTokenizer; AutoTokenizer.from_pretrained("moonshotai/Kimi-K3.1-Pro", revision="d9e99b0792a5e93b78ea9bea62a68167e36ddd9e", trust_remote_code=True).save_pretrained(sys.argv[1])' "$TOKENIZER_PATH" &&
    set +e &&
    echo "==================================================" &&
    echo ">>> DSpark TP8/KVP8 input=50k output=500 conc=32" &&
    echo "==================================================" &&
    /tmp/evalscope-perf/bin/evalscope perf
    --model "$MODEL"
    --url "$URL"
    --api openai
    --dataset random
    --data-source huggingface
    --tokenizer-path "$TOKENIZER_PATH"
    --min-prompt-length 50000
    --max-prompt-length 50000
    --prefix-length 0
    --min-tokens 500
    --max-tokens 500
    --parallel 32
    --number 32
    --warmup-num 0
    --rate -1
    --dataset-offset 300160
    --seed 20260906
    --temperature 0
    --no-apply-chat-template
    --stream
    --no-test-connection
    --total-timeout 21600
    --outputs-dir "$OUTPUTS_DIR/input_50k"
    --no-timestamp
    --extra-args '{"ignore_eos": true}';
    PERF_STATUS=$?;
    python3 "$REPO_ROOT/test/random_benchmark/tokenspeed/collect_outputs.py" "$OUTPUTS_DIR" --num-gpus 8 --emit-csv;
    PARSE_STATUS=$?;
    echo "=== DSpark speculative decoding metrics ===";
    curl -s http://127.0.0.1:21000/metrics | grep -E 'spec_|accept|draft' || true;
    if [ "$PERF_STATUS" -ne 0 ]; then exit "$PERF_STATUS"; fi;
    exit "$PARSE_STATUS"
report:
  github_step_summary: true
