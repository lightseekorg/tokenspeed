api_version: ci.tokenspeed.io/v1
name: perf-glm-5.3-flash-fp8-mtp-tp4ep4-sharegpt-nvidia
type: perf
workflow_stage: model-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - b200-4gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
server:
  command: >-
    ts serve
    --model zai-org/GLM-5.3-Flash
    --served-model-name glm-5.3-flash
    --attn-tp-size 4
    --enable-expert-parallel
    --language-model-only
    --moe-backend flashinfer_trtllm
    --max-model-len 32768
    --max-num-seqs 32
    --max-prefill-tokens 8192
    --chunked-prefill-size 4096
    --max-cudagraph-capture-size 80
    --cudagraph-capture-sizes 1 2 4 8 16 32
    --gpu-memory-utilization 0.85
    --trust-remote-code
    --sampling-backend flashinfer
    --disable-kvstore
    --kvstore-ratio 0.0
    --no-enable-prefix-caching
    --host 127.0.0.1
    --port 8000
    --policy round_robin
    --disable-health-check
    --engine-startup-timeout 1800
    --gateway-startup-timeout 600
    --speculative-algorithm MTP
    --speculative-draft-model-path
    zai-org/GLM-5.3-Flash
    --draft-model-path-use-base
    --speculative-num-steps 3
    --speculative-eagle-topk 1
    --speculative-num-draft-tokens 4
  ready:
    url: http://127.0.0.1:8000/readiness
    timeout: 1800
    interval: 10
perf:
  install:
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]==1.10.0'
  command: |
    set -eu
    RESULTS_DIR=/tmp/tokenspeed-glm53-flash-sharegpt
    trap 'rm -rf "$RESULTS_DIR"' EXIT
    rm -rf "$RESULTS_DIR"
    run_sharegpt() {
      /tmp/evalscope-perf/bin/evalscope perf \
        --model glm-5.3-flash \
        --url http://127.0.0.1:8000/v1/completions \
        --api openai \
        --dataset share_gpt_en \
        --tokenizer-path zai-org/GLM-5.3-Flash \
        --tokenize-prompt \
        --max-prompt-length 32256 \
        --min-tokens 512 \
        --max-tokens 512 \
        --parallel 16 \
        --number 16 \
        --warmup-num 16 \
        --rate -1 \
        --seed 45 \
        --temperature 0 \
        --stream \
        --outputs-dir "$1" \
        --no-timestamp \
        --extra-args '{"ignore_eos":true}'
    }
    for run_id in 1 2 3; do
      run_sharegpt "${RESULTS_DIR}/run_${run_id}"
    done
    python3 - "$RESULTS_DIR" <<'PY'
    import json
    import statistics
    import sys
    from pathlib import Path

    results = []
    for run_id in range(1, 4):
        summaries = list(
            (Path(sys.argv[1]) / f"run_{run_id}").rglob("benchmark_summary.json")
        )
        if len(summaries) != 1:
            raise SystemExit(
                f"expected one benchmark summary for run {run_id}, got {summaries}"
            )
        results.append(json.loads(summaries[0].read_text(encoding="utf-8")))
    failed = sum(result.get("Failed Requests", 0) for result in results)
    if failed:
        raise SystemExit(f"ShareGPT benchmark had {failed} failed requests")

    latency_tps = statistics.median(
        1000.0 / float(result["Avg TPOT (ms)"]) for result in results
    )
    throughput_per_gpu = statistics.median(
        float(result["Output Throughput (tok/s)"]) / 4 for result in results
    )
    print("\nOverall perf table:")
    print(
        "config,Conc.,Latency (tps/user),Throughput (tps/gpu),"
        "Approx Cache Hit,Decoded Tok/Iter"
    )
    print(f"sharegpt-512,16,{latency_tps:.2f},{throughput_per_gpu:.2f},0,0")
    PY
report:
  github_step_summary: true
perf_threshold: 0.9
# Median of three hot fixed-seed runs on 4x B200, rounded down. Values are
# [Latency (tps/user), Throughput (tps/gpu)].
perf_reference:
  16: [112.2, 280.4]
