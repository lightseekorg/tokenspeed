api_version: ci.tokenspeed.io/v1
# TP8/EP1 performance coverage exercises the tensor-parallel MoE placement and
# its gfx950 A8W4 SiTU kernel.
#
# The gap was not theoretical: EP1 deadlocked during HIP graph capture
# (hipBLASLt "operation not permitted when stream is capturing" (900) on every
# rank, GPUs pinned at 0% utilization) while EP8 captured cleanly, so the bug
# reached main unnoticed and was only found by hand. Server startup alone
# exercises that path: the capture happens before the first request, so a
# regression shows up here as a startup failure without needing the perf
# numbers to mean anything.
#
# Keep --cudagraph-capture-sizes set. Running this job with --enforce-eager
# would skip capture entirely and silence exactly the class of bug it exists
# to catch.
#
# Keep this speculator-free startup/performance control manual; the EAGLE3.1
# sibling is the per-commit performance gate.
name: perf-kimi-k3.1-pro-mxfp4-tp8ep1-random-4k-1k-mi35x
type: perf
workflow_stage: model-test
triggers:
  - manual
runner:
  labels:
    - amd-mi350-8gpu-bench
env:
  CI: "true"
  KIMI_K31_GATEWAY_TOKENIZER: /cache/huggingface/kimi-k3.1-gateway-tokenizer
install:
  - bash test/ci_system/install_deps_rocm.sh
server:
  command: >-
    ts serve
    --model moonshotai/Kimi-K3.1-Pro
    --revision d9e99b0792a5e93b78ea9bea62a68167e36ddd9e
    --tokenizer ${KIMI_K31_GATEWAY_TOKENIZER:?K3.1_gateway_tokenizer_not_staged}
    --served-model-name kimi-k3.1
    --tp 8
    --ep-size 1
    --attention-backend dsa
    --moe-backend auto
    --kv-cache-dtype fp8
    --mm-encoder-tp-mode data
    --max-model-len 8192
    --max-num-seqs 1
    --max-cudagraph-capture-size 1
    --cudagraph-capture-sizes 1
    --disable-prefill-graph
    --gpu-memory-utilization 0.92
    --trust-remote-code
    --sampling-backend greedy
    --disable-kvstore
    --kvstore-ratio 0.0
    --disable-prefix-caching
    --host 127.0.0.1
    --port 21000
    --policy round_robin
    --engine-startup-timeout 1200
    --gateway-startup-timeout 600
  ready:
    # The guarded failure is a deadlock, not a crash: nothing is raised, the
    # server simply never reports ready. Keep the ceiling short enough to
    # report the failure instead of occupying an 8-GPU runner for an hour.
    url: http://127.0.0.1:21000/readiness
    timeout: 1800
    interval: 10
perf:
  install:
    # Keep the load generator fixed while establishing the K3.1 reference;
    # EvalScope 1.10 changed its metric semantics.
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]==1.9.1'
  # EvalScope loads remote tokenizer paths through ModelScope even when the
  # dataset source is Hugging Face, so materialize the HF tokenizer locally.
  command: >-
    REPO_ROOT=$PWD &&
    MODEL=kimi-k3.1 &&
    URL=http://127.0.0.1:21000/v1/completions &&
    OUTPUTS_DIR=/tmp/tokenspeed-kimi-k3.1-pro-ep1-mi35x-perf &&
    TOKENIZER_PATH="$OUTPUTS_DIR/tokenizer" &&
    trap 'rm -rf "$OUTPUTS_DIR"' EXIT &&
    rm -rf "$OUTPUTS_DIR" &&
    /tmp/evalscope-perf/bin/python -c 'import sys; from transformers import AutoTokenizer; AutoTokenizer.from_pretrained("moonshotai/Kimi-K3.1-Pro", revision="d9e99b0792a5e93b78ea9bea62a68167e36ddd9e", trust_remote_code=True).save_pretrained(sys.argv[1])' "$TOKENIZER_PATH" &&
    set +e &&
    echo "==================================================" &&
    echo ">>> input=4k output=1k conc=1" &&
    echo "==================================================" &&
    /tmp/evalscope-perf/bin/evalscope perf
    --model "$MODEL"
    --url "$URL"
    --api openai
    --dataset random
    --data-source huggingface
    --tokenizer-path "$TOKENIZER_PATH"
    --min-prompt-length 4096
    --max-prompt-length 4096
    --prefix-length 0
    --min-tokens 1024
    --max-tokens 1024
    --parallel 1
    --number 1
    --warmup-num 1
    --rate -1
    --seed 1
    --temperature 0
    --stream
    --outputs-dir "$OUTPUTS_DIR/input_4k"
    --no-timestamp
    --extra-args '{"ignore_eos": true}';
    PERF_STATUS=$?;
    python3 "$REPO_ROOT/test/random_benchmark/tokenspeed/collect_outputs.py" "$OUTPUTS_DIR" --num-gpus 8 --emit-csv;
    PARSE_STATUS=$?;
    if [ "$PERF_STATUS" -ne 0 ]; then exit "$PERF_STATUS"; fi;
    exit "$PARSE_STATUS"
report:
  github_step_summary: true
