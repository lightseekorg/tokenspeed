[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenspeed"
version = "0.1.1"
description = "TokenSpeed is a speed-of-light LLM inference engine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Floor at the first release line with cp312 wheels: when PyPI serves a
    # bad Content-Type for a dependency's index page (observed for multidict),
    # pip skips it and silently backtracks aiohttp to pre-1.0 releases that no
    # longer declare it; those cannot even import on Python 3.12. With every
    # admissible aiohttp requiring multidict, the same flake instead fails the
    # resolver and the CI install retry loop handles it.
    "aiohttp>=3.9",
    "compressed-tensors",
    "dill",
    "einops",
    "fastapi",
    "hf_transfer",
    "huggingface_hub",
    "modelscope",
    "msgspec",
    "ninja",
    "numpy",
    "openai>=2.24.1",
    "openai-harmony",
    "orjson",
    "packaging",
    "partial-json-parser",
    "peft",
    "pillow",
    "prometheus-client",
    "psutil",
    "pybind11",
    "pydantic",
    "py-spy",
    "pytest>=9",
    "pytest-asyncio",
    "python-multipart",
    "pyzmq",
    "requests",
    "setproctitle",
    "tiktoken",
    "torch",
    "torchvision",
    "tokenspeed-kernel>=0.1.5.dev0",
    "tokenspeed-mooncake>=0.3.13.post20261117",
    "tokenspeed-engine>=0.1.1.dev0",
    "tokenspeed-smg==1.16.0.post20261117",
    "tokenspeed-smg-grpc-proto==0.5.0.post20261117",
    "tokenspeed-smg-grpc-servicer==0.16.0.post20261117",
    "tqdm",
    "transformers==5.12.0",
    "uv",
    "uvicorn",
    "xgrammar==0.2.8",
    "viztracer",
]

[project.scripts]
tokenspeed = "tokenspeed.cli:main"
ts = "tokenspeed.cli:main"

[project.urls]
"Homepage" = "https://github.com/lightseekorg/tokenspeed"

[project.optional-dependencies]
# Capped: 0.1.9 clones internally, so a release that stops would alias silently.
instanttensor = ["instanttensor>=0.1.9,<0.2"]

[tool.setuptools]
license-files = ["LICENSE", "THIRDPARTYNOTICES"]

[tool.setuptools.packages.find]
include = ["tokenspeed*"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"triton" = { msg = "Use tokenspeed_triton instead." }
"torch.compile" = { msg = "Write the fused kernel directly in Triton instead." }
